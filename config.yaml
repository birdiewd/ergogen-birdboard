# Corne-style 3x5 + 3 thumb keyboard (left half).
#
# Loaded by https://ergogen.ceoloide.com via "From Repo". The ceoloide footprint
# library is bundled in the UI, so `ceoloide/<name>` footprints need no submodule.
# Custom footprints live in ./footprints/ and are referenced as `custom/<file_name>`.
#
# Design notes
#  - Only the LEFT half is defined. For the right half, flip the same PCB over
#    (switch footprints are `reversible`) and mirror the 3D prints in your slicer.
#  - One shared key layout (MX spacing, 19.05mm) serves every switch type. Plates
#    differ per switch via the cutout units below.
#  - NOT YET VERIFIED in the UI: stagger/splay values (tune visually), cutout and
#    plate sizes for low-profile MX and Choc v2, and the `hotswap` param on the
#    Gateron low-profile footprint. See README.md.

meta:
  engine: 4.1.0   # minimum version for the KiCad 8 footprints
  name: corne
  version: 0.1

units:
  # ---- key spacing ----
  kx: U           # 19.05mm, used for every switch type
  ky: U
  pad: 3          # board margin around each key rectangle

  # ---- plate cutouts (mm, square) ----
  mx_cut: 14
  lpmx_cut: 14    # Gateron KS-33 low-profile MX; check your switch datasheet
  choc_cut: 13.8  # Kailh Choc v1
  choc2_cut: 13.8 # Choc v2 / mini; check datasheet, adjust if needed

  # ---- 3D print dimensions (mm) ----
  plate_t: 1.5        # top plate thickness (Choc clips need ~1.2-1.5)
  floor_t: 2          # tray floor thickness
  wall_t: 2.4         # tray wall thickness
  tray_h: 8           # tray wall height; raise for MX + PCB + hotswap stack
  tol: 0.3            # gap between board outline and tray wall

  # ---- MCU area (right of the inner column, top aligned with the top key) ----
  thumb_fill: 3       # thumb-key board rectangles are this much larger, to close the gaps to the bottom row
  # ---- M2 standoff mounting holes (tray floor, PCB, plate share the same 8 positions) ----
  hole_print: 2.4     # clearance hole in printed parts (plate, tray floor) for an M2 screw
  hole_pcb: 2.2       # NPTH drill in the PCB

  mcu_w: 20.5         # RP2040-Zero footprint width
  mcu_pad_x: 5        # board padding left and right of the MCU (the cover standoff holes sit in it)
  mcu_zone_w: mcu_w + 2*mcu_pad_x
  mcu_x: kx/2 + pad/2 + mcu_zone_w/2 - 1   # MCU centre, from matrix_inner_top
  mcu_up: 0           # board top edge of the MCU zone sits this far above the top key edge
  zone_top: ky/2 + pad/2 + mcu_up          # top edge of the MCU zone (from matrix_inner_top)
  usb_overhang: 1     # the Zero's USB-C connector hangs this far over the top edge of the board
  mcu_zero_y: zone_top + usb_overhang - 13.716   # footprint origin is 13.716 from the connector tip
  mcu_bottom_y: mcu_zero_y - 11.94         # bottom of the Zero's pads

  # ---- USB-C link between the halves (4-pin breakout module under the MCU) ----
  # Positions are from matrix_inner_top. The module is 12 (y) x 13.8 (x) mm plus ~0.9 mm of
  # connector shell, pad row 2.1 mm behind its back edge, USB-C opening toward +x (the middle
  # of the keyboard). Its shell tip is flush with the right edge of the MCU zone.
  link_edge_x: mcu_x + mcu_zone_w/2        # right edge of the board here
  link_back_dx: 2.54                       # back-layer pad row is this much further out
  link_pin_x: link_edge_x - 12.6 - link_back_dx   # pad row of the front-layer module
  link_y: mcu_bottom_y - 2 - 6             # module centre: 2 below the MCU's bottom edge, then half the module (6)
  zone_bottom: link_y - 6 - 1              # 1 mm of board below the module
  mcu_zone_h: zone_top - zone_bottom       # total height of the MCU / USB-C zone
  link_notch_w: 13                         # tray wall cutout for the plug (y)
  link_notch_z: 2                          # wall left uncut above the tray floor (z)
  usb_notch_w: 13                          # tray wall cutout for the RP2040-Zero's USB-C plug (x)
  usb_notch_z: 2                           # wall left uncut above the tray floor (z)

  # ---- thumb cluster placement ----
  thumb_shift_x: 0.8kx - 4   # cluster x shift from matrix_middle_bottom (original layout was -0.2kx)

  # ---- MCU / USB-C cover (separate plate over the MCU area; the switch plate stops at the keys) ----
  cover_gap: 0.5       # gap between the switch plate and the cover
  cover_x0: kx/2 + pad/2 + cover_gap     # cover left edge, from matrix_inner_top
  board_fillet: 1     # corner radius of the PCB / tray outline (small enough for the 2-3 mm column steps)
  ear_h: 2.4             # the top corners of the MCU zone are this much taller than the main top edge ("ears")
  ear_gap: usb_notch_w/2 + 1   # ears start this far either side of the MCU centre (clear of the USB plug)
  cover_hole_edge: 2.2 # cover holes sit this far inside the cover's left / right edge
  cover_hole_dy0: 12.8 # ... and this far above the MCU footprint origin (just above the pad rows, in the ears)
  cover_hole_left: 2.6 # the two strip holes: distance right of the inner key column's board edge
  cover_hole_dy: 3.5   # ... and this far above/below the USB-C module centre

  # ---- per-key offsets (mm, from the key centre; +y is toward the top of the key) ----
  # NOT VERIFIED in the UI: LED and diode placement; tune after previewing the PCB.
  diode_mx_y: -5       # diode south of the switch
  diode_choc_y: -8.5   # Choc: hotswap/pins and LED take the middle, diode moved to the lower edge
  led_mx_y: 5.9        # LED north of the switch (MX pins are on the south side)
  led_choc_y: -4.7     # LED south of the switch (Choc pins are on the north side)

points:
  key:
    spread: kx
    padding: ky
  zones:
    matrix:
      anchor:
        shift: [100, -100]
      columns:
        outer:
          key.column_net: outer
          rows:
            bottom: { led_in: led_21, led_out: led_22 }   # LED #22
            home: { led_in: led_22, led_out: led_23 }   # LED #23
            top: { led_in: led_23, led_out: led_24 }   # LED #24
        pinky:
          key.column_net: pinky
          rows:
            bottom: { led_in: led_18, led_out: led_19 }   # LED #19
            home: { led_in: led_17, led_out: led_18 }   # LED #18
            top: { led_in: led_16, led_out: led_17 }   # LED #17
        ring:
          key.stagger: 3
          key.column_net: ring
          rows:
            bottom: { led_in: led_13, led_out: led_14 }   # LED #14
            home: { led_in: led_14, led_out: led_15 }   # LED #15
            top: { led_in: led_15, led_out: led_16 }   # LED #16
        middle:
          key.stagger: 3
          key.column_net: middle
          rows:
            bottom: { led_in: led_11, led_out: led_12 }   # LED #12
            home: { led_in: led_10, led_out: led_11 }   # LED #11
            top: { led_in: led_9, led_out: led_10 }   # LED #10
        index:
          key.stagger: -3
          key.column_net: index
          rows:
            bottom: { led_in: led_6, led_out: led_7 }   # LED #7
            home: { led_in: led_7, led_out: led_8 }   # LED #8
            top: { led_in: led_8, led_out: led_9 }   # LED #9
        inner:
          key.stagger: -2
          key.column_net: inner
          rows:
            bottom: { led_in: led_2, led_out: led_3 }   # LED #3
            home: { led_in: led_1, led_out: led_2 }   # LED #2
            top: { led_in: led_data, led_out: led_1 }   # LED #1
      rows:
        bottom:
          row_net: bottom
        home:
          row_net: home
        top:
          row_net: top
    # Three extra keys under the outer, pinky and ring columns (the far side from the thumb
    # cluster), directly below the bottom row. They share the column nets of the keys above
    # them and the `thumb` row net of the thumb cluster, so no extra MCU pins are needed.
    lower:
      key:
        row_net: thumb
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -ky]
      columns:
        l_outer:
          key.column_net: outer
          rows:
            low: { led_in: led_20, led_out: led_21 }   # LED #21
        l_pinky:
          key.column_net: pinky
          rows:
            low: { led_in: led_19, led_out: led_20 }   # LED #20
        l_ring:
          key.stagger: 3
          key.column_net: ring
          rows:
            low: { led_in: led_12, led_out: led_13 }   # LED #13
      rows:
        low:
    thumbs:
      key:
        row_net: thumb          # thumb keys form a 4th row on the matrix
        tags: thumb_key
      anchor:
        ref: matrix_middle_bottom
        shift: [thumb_shift_x, -1.15ky]
      columns:
        t_near:
          key.column_net: middle
          rows:
            cluster: { led_in: led_5, led_out: led_6 }   # LED #6
        t_mid:
          key.column_net: index
          key.splay: -12
          key.origin: [-0.5kx, -0.5ky]
          rows:
            cluster: { led_in: led_4, led_out: led_5 }   # LED #5
        t_far:
          key.column_net: inner
          key.tags: [thumb_key, tall]   # 1.5u key in portrait: the board and plate outline is 1.5u tall
          key.splay: -12
          key.origin: [-0.5kx, -0.5ky]
          rows:
            cluster: { led_in: led_3, led_out: led_4 }   # LED #4
      rows:
        cluster:

outlines:
  _keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx + pad, ky + pad]
  _mcu_area:
    - what: rectangle
      bound: false
      size: [mcu_zone_w, mcu_zone_h]
      adjust:
        ref: matrix_inner_top
        shift: [mcu_x, zone_top - mcu_zone_h/2]
  # Taller top corners of the MCU zone (board / tray / PCB): room for the cover's standoff holes above the Zero's pad rows.
  _mcu_ears:
    - what: rectangle
      bound: false
      size: [mcu_zone_w/2 - ear_gap, ear_h + 1]
      adjust:
        ref: matrix_inner_top
        shift: [mcu_x - (mcu_zone_w/2 + ear_gap)/2, zone_top + (ear_h - 1)/2]
    - what: rectangle
      bound: false
      size: [mcu_zone_w/2 - ear_gap, ear_h + 1]
      adjust:
        ref: matrix_inner_top
        shift: [mcu_x + (mcu_zone_w/2 + ear_gap)/2, zone_top + (ear_h - 1)/2]
  # Same corners on the cover (it is slightly narrower than the zone).
  _cover_ears:
    - what: rectangle
      bound: false
      size: [mcu_x - ear_gap - cover_x0, ear_h + 1]
      adjust:
        ref: matrix_inner_top
        shift: [(cover_x0 + mcu_x - ear_gap)/2, zone_top + (ear_h - 1)/2]
    - what: rectangle
      bound: false
      size: [link_edge_x - mcu_x - ear_gap, ear_h + 1]
      adjust:
        ref: matrix_inner_top
        shift: [(mcu_x + ear_gap + link_edge_x)/2, zone_top + (ear_h - 1)/2]
  # Cover over the MCU and the USB-C module: the whole MCU zone, minus a small gap to the switch plate.
  _cover_area:
    - what: rectangle
      bound: false
      size: [link_edge_x - cover_x0, mcu_zone_h]
      adjust:
        ref: matrix_inner_top
        shift: [(cover_x0 + link_edge_x)/2, zone_top - mcu_zone_h/2]
  # Cutout in the tray wall for the USB-C plug.
  _link_notch:
    - what: rectangle
      bound: false
      size: [tol + wall_t + 2, link_notch_w]
      adjust:
        ref: matrix_inner_top
        shift: [link_edge_x + (tol + wall_t)/2, link_y]
  # Cutout in the top wall of the tray for the RP2040-Zero's USB-C port (the Zero's USB end faces +y).
  _usb_notch:
    - what: rectangle
      bound: false
      size: [usb_notch_w, tol + wall_t + 2]
      adjust:
        ref: matrix_inner_top
        shift: [mcu_x, zone_top + (tol + wall_t)/2]
  # Slightly larger rectangles under the thumb keys. Without them the thumb cluster only
  # just touches the bottom row and leaves small enclosed gaps in the board and plates.
  _thumb_fill:
    - what: rectangle
      where: thumb_key
      bound: false
      size: [kx + pad + thumb_fill, ky + pad + thumb_fill]
  # t_far is a 1.5u key in portrait: extend its rectangle to 1.5u in the key's own (rotated) frame.
  _tall_fill:
    - what: rectangle
      where: tall
      bound: false
      size: [kx + pad + thumb_fill, 1.5ky + pad + thumb_fill]
  # Fills the gap in the board and plates between the lower row of keys (l_ring) and the thumb cluster (t_near).
  _thumb_gap:
    - what: rectangle
      bound: false
      size: [thumb_shift_x + 2, ky + pad + thumb_fill/2]
      adjust:
        aggregate:
          parts: [lower_l_ring_low, thumbs_t_near_cluster]
  # All board pieces merged, sharp corners (rounded as a whole in `board` below).
  _board_sharp:
    - what: outline
      name: _keys
    - what: outline
      name: _thumb_fill
    - what: outline
      name: _tall_fill
    - what: outline
      name: _thumb_gap
    - what: outline
      name: _mcu_area
    - what: outline
      name: _mcu_ears
  # PCB and tray outline: the merged shape rounded once, so the step corners between staggered columns,
  # the ears and the thumb cluster join are rounded too (not only each key rectangle's own corners).
  board:
    - what: outline
      name: _board_sharp
      fillet: board_fillet
  # Plate outline, same shape with sharp corners (no fillet).
  board_plate:
    - what: outline
      name: _keys
    - what: outline
      name: _thumb_fill
    - what: outline
      name: _tall_fill
    - what: outline
      name: _thumb_gap

  # ---- M2 mounting holes: same positions in plate, tray floor and PCB (see pcbs) ----
  _mount_holes:
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_outer_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_ring_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_index_top
        shift: [kx/2, -ky/2 - 1]   # nudged down: clears the inner key's hotswap pad
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: thumbs_t_mid_cluster
        shift: [kx/2 + 1, ky/2 * 0.4]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: lower_l_outer_low
        shift: [kx/2, ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: lower_l_ring_low
        shift: [kx/2, ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_inner_top
        shift: [cover_x0 + cover_hole_edge, mcu_zero_y + cover_hole_dy0]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_inner_top
        shift: [link_edge_x - cover_hole_edge, mcu_zero_y + cover_hole_dy0]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_inner_top
        shift: [kx/2 + pad/2 + cover_hole_left, link_y - cover_hole_dy]

  # ---- switch cutouts ----
  _cut_mx:
    - what: rectangle
      where: true
      bound: false
      size: mx_cut
  _cut_lpmx:
    - what: rectangle
      where: true
      bound: false
      size: lpmx_cut
  _cut_choc:
    - what: rectangle
      where: true
      bound: false
      size: choc_cut
  _cut_choc2:
    - what: rectangle
      where: true
      bound: false
      size: choc2_cut

  # ---- top plates, one per switch type ----
  plate_mx:
    - what: outline
      name: board_plate
    - what: outline
      name: _cut_mx
      operation: subtract
    - what: outline
      name: _mount_holes
      operation: subtract
  plate_lpmx:
    - what: outline
      name: board_plate
    - what: outline
      name: _cut_lpmx
      operation: subtract
    - what: outline
      name: _mount_holes
      operation: subtract
  plate_choc:
    - what: outline
      name: board_plate
    - what: outline
      name: _cut_choc
      operation: subtract
    - what: outline
      name: _mount_holes
      operation: subtract
  plate_choc2:
    - what: outline
      name: board_plate
    - what: outline
      name: _cut_choc2
      operation: subtract
    - what: outline
      name: _mount_holes
      operation: subtract

  # ---- MCU / USB-C cover ----
  cover:
    - what: outline
      name: _cover_area
    - what: outline
      name: _cover_ears
    - what: outline
      name: _mount_holes
      operation: subtract

  # ---- tray (shared by all switch types) ----
  _tray_outer:
    - what: outline
      name: board
      expand: tol + wall_t
  tray_floor:
    - what: outline
      name: _tray_outer
    - what: outline
      name: _mount_holes
      operation: subtract
  tray_wall:
    - what: outline
      name: _tray_outer
    - what: outline
      name: board
      expand: tol
      operation: subtract

cases:
  plate_mx:
    - what: outline
      name: plate_mx
      extrude: plate_t
  plate_lpmx:
    - what: outline
      name: plate_lpmx
      extrude: plate_t
  plate_choc:
    - what: outline
      name: plate_choc
      extrude: plate_t
  plate_choc2:
    - what: outline
      name: plate_choc2
      extrude: plate_t
  cover:
    - what: outline
      name: cover
      extrude: plate_t
  tray:
    - what: outline
      name: tray_floor
      extrude: floor_t
    - what: outline
      name: tray_wall
      extrude: tray_h
      shift: [0, 0, floor_t]   # wall sits on top of the floor
    - what: outline
      name: _link_notch
      extrude: tray_h - link_notch_z
      shift: [0, 0, floor_t + link_notch_z]
      operation: subtract
    - what: outline
      name: _usb_notch
      extrude: tray_h - usb_notch_z
      shift: [0, 0, floor_t + usb_notch_z]
      operation: subtract

pcbs:
  # 4 switch types x 1 MCU = 4 PCBs (hotswap only), named
  #   corne_<switch>_zero
  # Generated by tools/gen_pcbs.py; editing this file by hand is fine too.
  # Shared parts use YAML anchors (&name / *name), defined at first use.
  # Nets: columns outer/pinky/ring/middle/index/inner, rows top/home/bottom/thumb, `link` (USB-C D+),
  # LED chain led_data -> led_1 ... led_24 (see the per-key led_in/led_out in `points`).

  corne_mx_zero:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      switch:
        what: ceoloide/switch_mx
        where: true
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          hotswap: true
          reversible: true
          include_keycap: true
      diode: &diode_mx
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          include_tht: true     # through-hole (DO-35 / 1N4148) pads
          reversible: true
        adjust:
          shift: [0, diode_mx_y]
      mcu: &mcu_zero
        # Waveshare RP2040-Zero. Matrix on the right edge, thumb and LED data on the bottom row. 3.3V LED data.
        what: custom/mcu_rp2040_zero
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mcu_x, mcu_zero_y]
        params:
          side: F
          mount: smd           # smd | th | both
          GP0: outer
          GP1: pinky
          GP2: ring
          GP3: middle
          GP4: index
          GP5: inner
          GP6: top
          GP7: home
          GP8: bottom
          GP9: thumb
          GP10: led_data
          GP12: link
      mcu_back: &mcu_back_zero
        # Waveshare RP2040-Zero. Matrix on the right edge, thumb and LED data on the bottom row. 3.3V LED data.
        what: custom/mcu_rp2040_zero
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mcu_x, mcu_zero_y]
        params:
          side: B
          mount: smd           # smd | th | both
          GP0: outer
          GP1: pinky
          GP2: ring
          GP3: middle
          GP4: index
          GP5: inner
          GP6: top
          GP7: home
          GP8: bottom
          GP9: thumb
          GP10: led_data
          GP12: link
      led: &led_zero_mx
        what: custom/led_ws2812b_5050
        where: true
        params:
          side: F
          din: "{{led_in}}"
          dout: "{{led_out}}"
          vdd: "5V"
        adjust:
          shift: [0, led_mx_y]
      led_back: &led_back_zero_mx
        what: custom/led_ws2812b_5050
        where: true
        params:
          side: B
          din: "{{led_in}}"
          dout: "{{led_out}}"
          vdd: "5V"
        adjust:
          shift: [0, led_mx_y]
      link: &link_zero
        what: custom/usbc_breakout_4pin
        where:
          ref: matrix_inner_top
        adjust:
          shift: [link_pin_x + 0, link_y]
        params:
          side: F
          vbus: "5V"
          dp: link
      link_back: &link_back_zero
        what: custom/usbc_breakout_4pin
        where:
          ref: matrix_inner_top
        adjust:
          shift: [link_pin_x + link_back_dx, link_y]
        params:
          side: B
          vbus: "5V"
          dp: link
      hole_1: &hole_1
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_outer_top
        adjust:
          shift: [kx/2, -ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_2: &hole_2
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_ring_top
        adjust:
          shift: [kx/2, -ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_3: &hole_3
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_index_top
        adjust:
          shift: [kx/2, -ky/2 - 1]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_4: &hole_4
        what: ceoloide/mounting_hole_npth
        where:
          ref: thumbs_t_mid_cluster
        adjust:
          shift: [kx/2 + 1, ky/2 * 0.4]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_5: &hole_5
        what: ceoloide/mounting_hole_npth
        where:
          ref: lower_l_outer_low
        adjust:
          shift: [kx/2, ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_6: &hole_6
        what: ceoloide/mounting_hole_npth
        where:
          ref: lower_l_ring_low
        adjust:
          shift: [kx/2, ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_7: &hole_7
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_inner_top
        adjust:
          shift: [cover_x0 + cover_hole_edge, mcu_zero_y + cover_hole_dy0]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_8: &hole_8
        what: ceoloide/mounting_hole_npth

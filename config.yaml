meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      # Column nets C0-C5 run outer to inner.
      # Row nets: R0 top, R1 home, R2 bottom, R3 thumb (mod + thumbfan).
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key:
            stagger: 0.5ky
            column_net: C2
        middle:
          key.stagger: .25ky
          key.column_net: C3
        index:
          key.stagger: -.33ky
          key.column_net: C4
        inner:
          key.stagger: -.15ky
          key.column_net: C5
      rows:
        bottom:
          row_net: R2
        home:
          row_net: R1
        top:
          row_net: R0
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      # Thumb row, first half: wired to the outer, pinky and ring columns.
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key.column_net: C2
      rows:
        thumb:
          row_net: R3
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      # Thumb row, second half: wired to the middle, index and inner columns.
      columns:
        outer:
          key.column_net: C3
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
          key.column_net: C4
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
            column_net: C5
      rows:
        thumb:
          row_net: R3
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        # top-left corner
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner
        - ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
        # bottom-most corner (added)
        - ref: thumbfan_home_thumb
          shift: [-0.75px, -0.5py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.5py]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.5px, -0.5py]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  tutorial:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      mx_lp:
        what: mx_lp
        where: true
        params:
          keycaps: true
          reverse: false
          from: "{{column_net}}"
          to: "{{name}}"
      # One diode per key, column-to-row: anode on the switch, cathode on the row net.
      diode:
        what: diode_k8
        where: true
        adjust:
          shift: [0, 5]
        params:
          from: "{{name}}"
          to: "{{row_net}}"
cases:

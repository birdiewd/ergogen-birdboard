meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      columns:
        outer:
        pinky:
        ring:
          key:
            stagger: 0.5ky
        middle:
          key.stagger: .25ky
        index:
          key.stagger: -.33ky
        inner:
          key.stagger: -.15ky
      rows:
        bottom:
        home:
        top:
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      columns:
        outer:
        pinky:
        ring:
      rows:
        thumb:
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      columns:
        outer:
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
      rows:
        thumb:
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner
        - ref: matrix_outer_top
          shift: [-0.5px, 0.5py]
        # top-left corner
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner
        - ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
        # bottom-most corner (added)
        - ref: thumbfan_home_thumb
          shift: [-0.75px, -0.5py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.5py]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.5px, -0.5py]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  tutorial:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      mx_lp:
        what: mx_lp
        where: true
        params:
          keycaps: true
          reverse: false
          from: "{{column_net}}"
          to: "{{colrow}}"
cases:

cases:
  # 3D-printable switch plate, sitting directly on the PCB (z = 0 is the PCB top).
  #   - frame: the combo outline (keycap-sized openings), frame_t thick, fills the
  #     gap between PCB and plate and stiffens it; clears the switch's lower housing
  #   - plate: plate_t thick on top, with 14 mm switch cutouts for the clips
  # Print it upside down (plate layer on the bed) for a flat top surface.
  switchplate:
    - what: outline
      name: frame
      extrude: frame_t
    - what: outline
      name: plate
      extrude: plate_t
      shift: [0, 0, frame_t]
      operation: add
  # Keyboard case (z = 0 is the case bottom): floor, 11 mm walls with openings for both
  # USB-C plugs, and standoffs with M2 heat-set insert holes under all mounting holes.
  # The PCB sits on the standoffs; the switch plate and the cover fit inside the walls.
  # This is the left half; mirror it in the slicer for the right half.
  keyboard_case:
    - what: outline
      name: case_outer
      extrude: case_floor
    - what: outline
      name: case_walls
      extrude: case_h
      operation: add
    - what: outline
      name: case_standoffs
      extrude: case_floor + case_gap
      operation: add
    - what: outline
      name: case_inserts
      extrude: case_h
      operation: subtract
    - what: outline
      name: case_usb_notches
      extrude: case_h
      shift: [0, 0, usb_z - usb_notch_down]
      operation: subtract
  # Cover for the MCU, USB-C breakout and LED (z = 0 is the PCB top). Screws through the
  # three strip holes (between the MCU and breakout, left of the breakout, below the LED).
  # Print it upside down (lid on the bed). The LED is under the lid: print in a
  # translucent filament if it should show through.
  mcu_cover:
    - what: outline
      name: cover_base
      extrude: cover_pocket
    - what: outline
      name: cover_top
      extrude: cover_lid
      shift: [0, 0, cover_pocket]
      operation: add

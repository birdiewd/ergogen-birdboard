# v2: switch plates (left and right) and one PCB holding both halves.
#
# Loaded by https://ergogen.ceoloide.com ("From Local File" or "From Repo").
# Layout measured from the sketch the plate is based on (19.05 mm = one column pitch):
#   - six columns outer..inner, three rows, plus a fourth row under the first three columns
#   - thumb keys d (straight), e (15 deg clockwise) and f (1.5u portrait, 30 deg clockwise)
# NOT VERIFIED in the UI yet: stagger / thumb offsets are rounded to 0.5 mm from the sketch.
#
# PCB (pcbs: birdboard): ONE board, both halves side by side. The halves touch exactly at the seam
# (x = link_edge_x from the inner column of each half) and are separated by a V-score along the seam (the
# height of the MCU zone; below it the board keeps the plate's angled edge, leaving a notch) (marked on the Dwgs.User layer; no mouse-bites). Right-half nets carry an `_r`
# suffix so the halves stay electrically separate. No tracks yet.

meta:
  engine: 4.1.0
  name: birdboard_v2
  version: 0.1

units:
  kx: U              # 19.05 mm
  ky: U
  cut: 14            # square switch cutout (every key, including the 1.5u key, centred on the cap)
  pad: 3             # board margin around each key rectangle
  thumb_fill: 4      # thumb rectangles are this much larger, to close gaps to the matrix (3 left a 1 mm2 hole)
  plate_fillet: 1    # corner radius of the plate outline
  thumb_d_x: 9.5     # thumb d: right of the middle column's bottom key
  # One straight-bottomed rectangle from the left edge of a4 to the right edge of thumb d (measured from a4's centre).
  bf_x0: -(kx + pad) / 2
  bf_x1: 3kx + thumb_d_x + (kx + pad + thumb_fill) / 2
  bf_y0: -(ky + pad) / 2    # bottom of a4: the lowest edge, so the bottom is flat
  rf_x0: (kx + pad) / 2    # inner column right edge
  rf_y_top: -3.72           # see _right_fill
  rf_x1: 12.51
  rf_y1: -4.58
  rf_y_low: -8.5
  bf_y1: 16                 # reaches up into the matrix so no pocket is left under the middle column

  # ---- MCU / USB-C zone (right of the inner column of the left half; the right half is its mirror image) ----
  mcu_w: 20.5          # RP2040-Zero footprint width
  mcu_pad_x: 5         # board padding left and right of the MCU
  mcu_zone_w: mcu_w + 2*mcu_pad_x
  mcu_x: kx/2 + pad/2 + mcu_zone_w/2 - 1     # MCU centre, from matrix_inner_top
  zone_top: ky/2 + pad/2                     # top edge of the zone (from matrix_inner_top), flush with the inner column's top
  usb_overhang: 1      # the Zero's USB-C connector hangs this far over the top edge
  mcu_zero_y: zone_top + usb_overhang - 13.716    # footprint origin is 13.716 from the connector tip
  mcu_bottom_y: mcu_zero_y - 11.94           # bottom of the Zero's pads
  link_edge_x: mcu_x + mcu_zone_w/2          # THE SEAM: right edge of the left half, from matrix_inner_top
  link_pin_x: link_edge_x - 12.6             # USB-C breakout pad row; its shell tip is flush with the seam
  link_y: mcu_bottom_y - 2 - 6               # module centre: 2 below the MCU's pads, then half the module (6)
  zone_bottom: link_y - 6 - 1                # 1 mm of board below the module
  mcu_zone_x0: mcu_x - mcu_zone_w/2          # left edge of the zone
  seam_overshoot: 0.05   # each half's seam shapes reach this far past the seam so the union has no sliver; the V-score removes it
  board_fillet: 1        # corner radius of the board outline (applied once to the union, so the seam stays square)
  vscore_ext: 3          # V-score line extends this far past the top and bottom of the zone
  # ---- M2 mounting holes ----
  hole_print: 2.4        # clearance hole in the plates for an M2 screw
  hole_pcb: 2.2          # NPTH drill in the PCB
  mz_hole_x0: 12.8                  # MCU zone holes (PCB only), from matrix_inner_top: left strip, beside the Zero's pads
  mz_hole_x1: link_edge_x - 2.5     # ... and right strip, 2.5 from the seam
  mz_hole_y: zone_top - 2.5         # ... both this far below the top edge
  mz_hole_y2: link_y - 3.5          # third hole, beside the USB-C module
  # ---- diode ----
  diode_y: -9            # THT diode south of the switch: -5 shorts the row pad to the column pad, -9 clears every pad by ~0.6 mm

points:
  key:
    spread: kx
    padding: ky
  # Ergogen mirrors every point (named mirror_<zone>_<column>_<row>) to a copy this far to the right: the
  # distance between matrix_inner_top and its mirror image is twice the distance to the seam, so the two
  # halves touch exactly at the seam. The left outlines below only use the original points; the
  # right-hand ones (_r) use the mirrored copies.
  mirror:
    ref: matrix_inner_top
    distance: 2*link_edge_x
  zones:
    matrix:
      anchor:
        shift: [100, -100]
      columns:
        outer:
          key.column_net: outer
        pinky:
          key.column_net: pinky
        ring:
          key.stagger: 5      # up 5 mm from the pinky column
          key.column_net: ring
        middle:
          key.stagger: 2      # up 7 mm from the outer columns
          key.column_net: middle
        index:
          key.stagger: -2     # up 5 mm
          key.column_net: index
        inner:
          key.stagger: -2.5   # up 2.5 mm
          key.column_net: inner
      rows:
        bottom:
          row_net: bottom
        home:
          row_net: home
        top:
          row_net: top
    # The fourth row: only under the outer, pinky and ring columns, in line with them.
    # They share the column nets of the keys above them and the `thumb` row net of the thumb keys.
    lower:
      key:
        row_net: thumb
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -ky]
      columns:
        l_outer:
          key.column_net: outer
        l_pinky:
          key.column_net: pinky
        l_ring:
          key.stagger: 5
          key.column_net: ring
      rows:
        low:
    # Thumb keys, positioned from the middle column's bottom key (offsets measured from the sketch).
    # The thumb keys form a fourth matrix row (`thumb`), on the middle, index and inner columns.
    thumb_d:
      key.tags: thumb_key
      key.row_net: thumb
      anchor:
        ref: matrix_middle_bottom
        shift: [thumb_d_x, -22.5]
      columns:
        k:
          key.column_net: middle
          rows:
            r:
    thumb_e:
      key.tags: thumb_key
      key.row_net: thumb
      anchor:
        ref: matrix_middle_bottom
        shift: [31.5, -26]
        rotate: -15           # clockwise (fitted from the sketch)
      columns:
        k:
          key.column_net: index
          rows:
            r:
    # 1.5u key in portrait; the point is the centre of the cap, and the cutout is centred on it.
    thumb_f:
      key.tags: [thumb_key, tall]
      key.row_net: thumb
      anchor:
        ref: matrix_middle_bottom
        shift: [53, -31]
        rotate: -30           # clockwise (fitted from the sketch)
      columns:
        k:
          key.column_net: inner
          rows:
            r:

outlines:
  _keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx + pad, ky + pad]
  _thumb_fill:
    - what: rectangle
      where: thumb_key
      bound: false
      size: [kx + pad + thumb_fill, ky + pad + thumb_fill]
  # The 1.5u key is 1.5u tall in its own (rotated) frame.
  _tall_fill:
    - what: rectangle
      where: tall
      bound: false
      size: [kx + pad + thumb_fill, 1.5ky + pad + thumb_fill]
  # Flat bottom edge from a4 to thumb d (replaces the stepped edge of the individual key rectangles).
  _bottom_fill:
    - what: rectangle
      bound: false
      size: [bf_x1 - bf_x0, bf_y1 - bf_y0]
      adjust:
        ref: lower_l_outer_low
        shift: [(bf_x0 + bf_x1) / 2, (bf_y0 + bf_y1) / 2]
  # Closes the gap between the inner column's bottom key and thumb e (opened up by the thumb tilt).
  _thumb_bridge:
    - what: rectangle
      bound: false
      size: [24, 24]   # 26 poked 0.27 mm past the inner column once Ergogen averaged the parts' rotation
      adjust:
        aggregate:
          parts: [matrix_inner_bottom, thumb_e_k_r]
  # Flat top across the ring, middle and index columns: removes the two 2 mm steps (their fillets left a hook).
  _top_fill:
    - what: rectangle
      bound: false
      size: [3kx + pad, (ky + pad) / 2]
      adjust:
        ref: matrix_middle_top
        shift: [0, (ky + pad) / 4]
  # Fills the thin V between the inner column's right edge and the corner of thumb f's rectangle, so the right
  # edge runs straight down into the thumb's top edge. Offsets are from the centre of matrix_inner_bottom:
  # (rf_x0, rf_y_top) is where thumb f's top edge, extended, meets the column edge; (rf_x1, rf_y1) is the corner.
  _right_fill:
    - what: polygon
      points:
        - ref: matrix_inner_bottom
          shift: [rf_x0, rf_y_top]
        - ref: matrix_inner_bottom
          shift: [rf_x1, rf_y1]
        - ref: matrix_inner_bottom
          shift: [rf_x0, rf_y_low]
  # Covers a pocket of ~0.001-0.007 mm2 left between the inner column's bottom edge, thumb e, thumb f and the bridge.
  # Everything in this rectangle is already inside the outline except that pocket, so it adds no area elsewhere.
  _pocket_fill:
    - what: rectangle
      bound: false
      size: [4, 2.5]
      adjust:
        ref: matrix_inner_bottom
        shift: [7.75, -11.75]
  _plate_sharp:
    - what: outline
      name: _keys
    - what: outline
      name: _thumb_fill
    - what: outline
      name: _tall_fill
    - what: outline
      name: _bottom_fill
    - what: outline
      name: _thumb_bridge
    - what: outline
      name: _top_fill
    - what: outline
      name: _right_fill
    - what: outline
      name: _pocket_fill
  _plate_rounded:
    - what: outline
      name: _plate_sharp
      fillet: plate_fillet
  _cutouts:
    - what: rectangle
      where: true
      bound: false
      size: cut
  # ---- Right-hand plate: the same shapes on the mirrored points (points.mirror). Nothing is flipped by hand:
  # `asym: clone` selects the mirrored copies of the matched points, and an anchor whose ref is a mirrored point
  # has its shift and rotation mirrored by Ergogen. Offsets here are identical to the left-hand ones above.
  _keys_r:
    - what: rectangle
      where: true
      asym: clone
      bound: false
      size: [kx + pad, ky + pad]
  _thumb_fill_r:
    - what: rectangle
      where: thumb_key
      asym: clone
      bound: false
      size: [kx + pad + thumb_fill, ky + pad + thumb_fill]
  _tall_fill_r:
    - what: rectangle
      where: tall
      asym: clone
      bound: false
      size: [kx + pad + thumb_fill, 1.5ky + pad + thumb_fill]
  _bottom_fill_r:
    - what: rectangle
      bound: false
      size: [bf_x1 - bf_x0, bf_y1 - bf_y0]
      adjust:
        ref: mirror_lower_l_outer_low
        shift: [(bf_x0 + bf_x1) / 2, (bf_y0 + bf_y1) / 2]
  _thumb_bridge_r:
    - what: rectangle
      bound: false
      size: [24, 24]
      adjust:
        aggregate:
          parts: [mirror_matrix_inner_bottom, mirror_thumb_e_k_r]
  _top_fill_r:
    - what: rectangle
      bound: false
      size: [3kx + pad, (ky + pad) / 2]
      adjust:
        ref: mirror_matrix_middle_top
        shift: [0, (ky + pad) / 4]
  _right_fill_r:
    - what: polygon
      points:
        - ref: mirror_matrix_inner_bottom
          shift: [rf_x0, rf_y_top]
        - ref: mirror_matrix_inner_bottom
          shift: [rf_x1, rf_y1]
        - ref: mirror_matrix_inner_bottom
          shift: [rf_x0, rf_y_low]
  _pocket_fill_r:
    - what: rectangle
      bound: false
      size: [4, 2.5]
      adjust:
        ref: mirror_matrix_inner_bottom
        shift: [7.75, -11.75]
  _plate_sharp_r:
    - what: outline
      name: _keys_r
    - what: outline
      name: _thumb_fill_r
    - what: outline
      name: _tall_fill_r
    - what: outline
      name: _bottom_fill_r
    - what: outline
      name: _thumb_bridge_r
    - what: outline
      name: _top_fill_r
    - what: outline
      name: _right_fill_r
    - what: outline
      name: _pocket_fill_r
  _plate_rounded_r:
    - what: outline
      name: _plate_sharp_r
      fillet: plate_fillet
  _cutouts_r:
    - what: rectangle
      where: true
      asym: clone
      bound: false
      size: cut
  # ---- PCB outline: plate pieces + MCU / USB-C zone, per half. The halves touch only along the MCU zone; below it the
  # board keeps the plate's angled edge next to the inner thumb keys, leaving a notch between the halves.
  # Filleted once, after the union, so the seam stays a straight line (no notches between the halves).
  _mcu_zone:
    - what: rectangle
      bound: false
      size: [link_edge_x + seam_overshoot - mcu_zone_x0, zone_top - zone_bottom]
      adjust:
        ref: matrix_inner_top
        shift: [(mcu_zone_x0 + link_edge_x + seam_overshoot) / 2, (zone_top + zone_bottom) / 2]
  _board_sharp_l:
    - what: outline
      name: _plate_sharp
    - what: outline
      name: _mcu_zone
  _mcu_zone_r:
    - what: rectangle
      bound: false
      size: [link_edge_x + seam_overshoot - mcu_zone_x0, zone_top - zone_bottom]
      adjust:
        ref: mirror_matrix_inner_top
        shift: [(mcu_zone_x0 + link_edge_x + seam_overshoot) / 2, (zone_top + zone_bottom) / 2]
  _board_sharp_r:
    - what: outline
      name: _plate_sharp_r
    - what: outline
      name: _mcu_zone_r
  _board_sharp:
    - what: outline
      name: _board_sharp_l
    - what: outline
      name: _board_sharp_r
  _board:
    - what: outline
      name: _board_sharp
      fillet: board_fillet
  # ---- M2 mounting holes in the plates (the 3 MCU-zone holes are PCB-only, see pcbs:). Same anchors on both halves;
  # the right-hand ones use the mirrored points, whose shifts Ergogen mirrors.
  _holes:
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_outer_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_ring_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_index_top
        shift: [kx/2, -ky/2 - 1]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: lower_l_outer_low
        shift: [kx/2, ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_middle_bottom
        shift: [-3.65, -17]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: matrix_inner_bottom
        shift: [8.75, -12.5]
  _holes_r:
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_matrix_outer_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_matrix_ring_top
        shift: [kx/2, -ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_matrix_index_top
        shift: [kx/2, -ky/2 - 1]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_lower_l_outer_low
        shift: [kx/2, ky/2]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_matrix_middle_bottom
        shift: [-3.65, -17]
    - what: circle
      radius: hole_print / 2
      adjust:
        ref: mirror_matrix_inner_bottom
        shift: [8.75, -12.5]
  # Exported for review: the outline with every switch cutout and mounting hole.
  plate:
    - what: outline
      name: _plate_rounded
    - what: outline
      name: _cutouts
      operation: subtract
    - what: outline
      name: _holes
      operation: subtract
  # Exported: the right-hand plate (mirror image of `plate`).
  plate_right:
    - what: outline
      name: _plate_rounded_r
    - what: outline
      name: _cutouts_r
      operation: subtract
    - what: outline
      name: _holes_r
      operation: subtract
  # Exported: the PCB outline of both halves joined at the seam (the V-score line is a drawing-layer marker, see pcbs).
  board:
    - what: outline
      name: _board

pcbs:
  # ONE board with both halves. The left half is the points as defined; the right half is their mirror image
  # (points.mirror). Right-half nets carry an `_r` suffix so the halves stay separate (no ratsnest across the seam).
  # Footprints default to asym: both, so each is split into a `source` (left) and a `clone` (right) entry here.
  # Right-hand footprints that use an anchor with a mirrored ref spell out the mirrored x and set `resist: true`.
  birdboard:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      switch_l:
        what: ceoloide/switch_gateron_ks27_ks33
        where: true
        asym: source
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          hotswap: true
          reversible: true
      switch_r:
        what: ceoloide/switch_gateron_ks27_ks33
        where: true
        asym: clone
        params:
          from: "{{column_net}}_r"
          to: "{{colrow}}_r"
          hotswap: true
          reversible: true
      diode_l:
        what: ceoloide/diode_tht_sod123
        where: true
        asym: source
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          include_tht: true
          reversible: true
        adjust:
          shift: [0, diode_y]
      diode_r:
        what: ceoloide/diode_tht_sod123
        where: true
        asym: clone
        params:
          from: "{{colrow}}_r"
          to: "{{row_net}}_r"
          include_tht: true
          reversible: true
        adjust:
          shift: [0, diode_y]
      mcu_l:
        what: custom/mcu_rp2040_zero
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mcu_x, mcu_zero_y]
        params:
          side: F
          mount: smd
          GP0: "outer"
          GP1: "pinky"
          GP2: "ring"
          GP3: "middle"
          GP4: "index"
          GP5: "inner"
          GP6: "top"
          GP7: "home"
          GP8: "bottom"
          GP9: "thumb"
          GP12: "link"
      mcu_r:
        what: custom/mcu_rp2040_zero
        where:
          ref: mirror_matrix_inner_top
        adjust:
          shift: [-mcu_x, mcu_zero_y]
          resist: true
        params:
          side: F
          mount: smd
          V5: "5V_r"
          GND: "GND_r"
          V3V3: "3V3_r"
          GP0: "outer_r"
          GP1: "pinky_r"
          GP2: "ring_r"
          GP3: "middle_r"
          GP4: "index_r"
          GP5: "inner_r"
          GP6: "top_r"
          GP7: "home_r"
          GP8: "bottom_r"
          GP9: "thumb_r"
          GP12: "link_r"
          GP10: "GP10_r"
          GP11: "GP11_r"
          GP13: "GP13_r"
          GP14: "GP14_r"
          GP15: "GP15_r"
          GP26: "GP26_r"
          GP27: "GP27_r"
          GP28: "GP28_r"
          GP29: "GP29_r"
      link_l:
        what: custom/usbc_breakout_4pin
        where:
          ref: matrix_inner_top
        adjust:
          shift: [link_pin_x, link_y]
        params:
          side: F
          vbus: "5V"
          dp: link
      # The right module is the same part turned 180 degrees: its USB-C opening faces the seam, like the left one.
      link_r:
        what: custom/usbc_breakout_4pin
        where:
          ref: mirror_matrix_inner_top
        adjust:
          shift: [-link_pin_x, link_y]
          rotate: 180
          resist: true
        params:
          side: F
          vbus: "5V_r"
          gnd: "GND_r"
          dp: link_r
      hole_l1:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_outer_top
        adjust:
          shift: [kx/2, -ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l2:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_ring_top
        adjust:
          shift: [kx/2, -ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l3:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_index_top
        adjust:
          shift: [kx/2, -ky/2 - 1]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l4:
        what: ceoloide/mounting_hole_npth
        where:
          ref: lower_l_outer_low
        adjust:
          shift: [kx/2, ky/2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l5:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_middle_bottom
        adjust:
          shift: [-3.65, -17]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l6:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_inner_bottom
        adjust:
          shift: [8.75, -12.5]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l7:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mz_hole_x0, mz_hole_y]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l8:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mz_hole_x1, mz_hole_y]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_l9:
        what: ceoloide/mounting_hole_npth
        where:
          ref: matrix_inner_top
        adjust:
          shift: [mz_hole_x0, mz_hole_y2]
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_r1:
        what: ceoloide/mounting_hole_npth
        where:
          ref: mirror_matrix_outer_top
        adjust:
          shift: [-kx/2, -ky/2]
          resist: true
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_r2:
        what: ceoloide/mounting_hole_npth
        where:
          ref: mirror_matrix_ring_top
        adjust:
          shift: [-kx/2, -ky/2]
          resist: true
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_r3:
        what: ceoloide/mounting_hole_npth
        where:
          ref: mirror_matrix_index_top
        adjust:
          shift: [-kx/2, -ky/2 - 1]
          resist: true
        params:
          hole_size: hole_pcb
          hole_drill: hole_pcb
      hole_r4:
        what: ceoloide/mounting_hole_npth
        where:
          ref: mirror_lower_l_outer_low
        adjust:
          shift: [-kx/2, ky/2]
          resist: true
        params:

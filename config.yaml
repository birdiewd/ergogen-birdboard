meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
  # Extra board on the left and bottom edges for M2 mounting holes. With it the edge is
  # 5 mm past the keycaps, so a hole centred 2.5 mm out clears an M2 head (3.8 mm)
  # on the keycap side and keeps 2.5 mm to the board edge.
  mount_pad: 3
  hole_d: 2.2         # M2 clearance hole (PCB and plate)
  hole_off: 2.5       # hole centre distance outside the keycap edge
  # 3D-printed cover over the electronics strip (MCU, USB-C breakout, LED), screwed on
  # through the strip's three mounting holes. It sits on the PCB top: a wall layer with a
  # pocket for the parts that stand above the PCB (both USB-C shells and the LED reach
  # about 1.6 mm), then a solid lid.
  cover_wall: 1.5     # outer wall width
  cover_pocket: 2.5   # pocket depth (wall height): 1.6 mm parts + 0.9 mm clearance
  cover_lid: 1.5      # lid thickness on top (4 mm total)
  cover_boss: 3       # radius of the solid boss around each screw hole
  cover_gap: 0.3      # gap between the cover and the switch plate
  # Case: a tray the PCB screws into (z = 0 is the bottom of the case). Stack:
  #   floor 1.5 | gap 3.5 under the PCB (the MCU hangs 2.5 below it, so 1.0 clear; hot-swap
  #   sockets ~1.8, diodes, breakout board) | PCB 1.6 (top at 6.6) | switch plate 2.5
  #   (top at 9.1) | cover 4 (top at 10.6), so everything sits below the 11 mm wall.
  case_h: 11          # total wall height
  case_floor: 1.5     # floor thickness
  case_gap: 3.5       # floor to PCB underside (standoff height): MCU 2.5 + 1.0 clearance
  pcb_t: 1.6
  case_wall: 2        # wall thickness
  case_clear: 0.5     # gap between the PCB edge and the wall
  case_off: case_clear + case_wall
  standoff_r: 2.5     # standoff radius (5 mm)
  insert_r: 1.6       # hole for an M2 heat-set insert (3.2 mm)
  usb_z: case_floor + case_gap + pcb_t    # USB-C port centre height (level with the PCB top)
  usb_notch_w: 13     # wall opening for a USB-C plug's overmould
  usb_notch_down: 3.5 # opening reaches this far below the port centre (open to the top)
  # Switch plate (Gateron LP 2.0 / KS-33 dimensional drawing)
  switch_cut: 14      # switch body at plate level: 14.00 +/- 0.03
  print_tol: 0.1      # extra clearance added to each cutout for 3D printing
  plate_t: 1.2        # plate thickness the switch clips are made for: 1.20 +/- 0.05
  frame_t: 1.3        # gap from plate underside to PCB (switch housing below the plate)
  # Electronics strip beside the inner column (MCU at the top, USB-C link below it).
  # Its right edge lines up with the thumb cluster's right-most corner, and it runs down
  # to meet the thumb cluster. x positions below are measured from that edge (negative
  # = inwards), y positions from the inner column's top key (matrix_inner_top).
  mcu_w: 18.3         # Waveshare RP2040-Zero board
  mcu_h: 23.9
  usb_w: 13.8         # 4-pin USB-C breakout: length along the cable direction
  usb_h: 12           #   and width
  usb_gap: 10         # space between the MCU and the breakout
  mcu_x: -11.5                                     # RP2040-Zero centre: its pads end 1.23 mm from the edge
  mcu_y: 0.5py - mcu_h / 2
  # Cutout under the upside-down MCU for its components (inside the pad ring, open at the top
  # so the USB-C port sits in the PCB edge). Pad inner edges: x +/-6.77, bottom row y 9.26.
  mcu_cut_w: 12.4                                  # 0.57 mm clear of the side pads
  mcu_cut_down: 8.75                               # from the module centre down to the cutout bottom
  mcu_cut_up: mcu_h / 2 + 2                        # from the module centre up, past the board edge
  link_x: -12.6                                    # breakout pad row: shell flush with the edge
  # Cutout under the upside-down breakout for its USB-C receptacle (open at the edge).
  # The breakout's 12 mm board rests on the PCB underside along both sides of it.
  link_cut_w: 9.6                                  # receptacle ~8.9 wide, so ~1.2 mm rests either side
  link_cut_start: 3                                # from the pad row forward to the cutout (2.1 mm clear of the pads)
  link_cut_len: 12.6 - link_cut_start + 2          # to the board edge, plus 2 past it
  link_y: 0.5py - mcu_h - usb_gap - usb_h / 2
  # WS2812B status LED below the breakout, centred on it, halfway between the breakout's
  # bottom edge and the thumb key's padded top edge (16 mm apart at this x).
  led_x: link_x + 5.25                             # breakout board centre (it spans -2.1 to 12.6 from the pad row)
  led_y: link_y - usb_h / 2 - 8
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      # Column nets C0-C5 run outer to inner.
      # Row nets: R0 top, R1 home, R2 bottom, R3 thumb (mod + thumbfan).
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key:
            stagger: 0.5ky
            column_net: C2
        middle:
          key.stagger: .25ky
          key.column_net: C3
        index:
          key.stagger: -.33ky
          key.column_net: C4
        inner:
          key.stagger: -.15ky
          key.column_net: C5
      # col_up: distance up to the next key in the same column, for the column trace
      # (0 = top of the column, its route to the MCU is a separate trace below).
      rows:
        bottom:
          row_net: R2
          col_up: 19
        home:
          row_net: R1
          col_up: 19
        top:
          row_net: R0
          col_up: 0
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      # Thumb row, first half: wired to the outer, pinky and ring columns.
      # col_up reaches the column's bottom key: 1.1ky, plus the ring column's 0.5ky stagger.
      columns:
        outer:
          key.column_net: C0
          key.col_up: 18.7
        pinky:
          key.column_net: C1
          key.col_up: 18.7
        ring:
          key.column_net: C2
          key.col_up: 27.2
      rows:
        thumb:
          row_net: R3
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      # Thumb row, second half: wired to the middle, index and inner columns.
      columns:
        outer:
          key.column_net: C3
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
          key.column_net: C4
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
            column_net: C5
      # Not stacked on their columns: routed by the col_route_thumb_* traces instead.
      rows:
        thumb:
          row_net: R3
          col_up: 0
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner (mount_pad: room for mounting holes on the left edge)
        - ref: matrix_outer_top
          shift: [-0.5px - mount_pad, 0.5py]
        # top-left corner, raised by mount_pad for the hole above the ring key
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py + mount_pad]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner
        - ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
        # bottom-most corner (added); pushed out along the key's length by mount_pad
        # (down and slightly left) so the bottom edge gets the same extra room
        - ref: thumbfan_home_thumb
          shift: [-0.75px - mount_pad, -0.5py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.5py - mount_pad]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.5px - mount_pad, -0.5py - mount_pad]
  combo:
    - name: board
    - operation: subtract
      name: keys
  # 14 x 14 mm switch cutouts (Gateron LP KS-33), plus a little print tolerance.
  switch_cutouts:
  - what: rectangle
    where: true
    bound: false
    size: [switch_cut + print_tol, switch_cut + print_tol]
  # Strip beside the inner column for the MCU and the USB-C link breakout. Its right
  # edge is vertical through the thumb cluster's right-most corner and runs down to
  # meet it; the other corners sit inside the key area so it merges with the board.
  # `thumb_edge` is an anchor step that keeps y but takes x from that corner.
  mcu_area:
  - what: polygon
    fillet: 2
    points:
      # top-left, on the board's top edge above the inner key
      - ref: matrix_inner_top
        shift: [0, 0.5py]
      # top-right: same height, x of the thumb corner
      - - ref: matrix_inner_top
          shift: [0, 0.5py]
        - &thumb_edge
          ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
          affect: x
      # the thumb cluster's right-most corner
      - ref: thumbfan_home_thumb
        shift: [0.75px, -0.5py]
      # along the board edge from that corner, then back through the keys
      - ref: thumbfan_home_thumb
        shift: [0, -0.5py]
      - ref: thumbfan_home_thumb
      - ref: matrix_inner_bottom
  # Open-topped cutout for the components of the upside-down RP2040-Zero.
  mcu_cutout:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + (mcu_cut_up - mcu_cut_down) / 2]
    size: [mcu_cut_w, mcu_cut_up + mcu_cut_down]
    corner: 1
  # Open-sided cutout for the receptacle of the upside-down USB-C breakout.
  link_cutout:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [link_x + link_cut_start + link_cut_len / 2, link_y]
    size: [link_cut_len, link_cut_w]
    corner: 1
  # PCB outline: the key area plus the electronics strip, minus the module cutouts.
  board_mcu:
    - name: board
    - operation: add
      name: mcu_area
    - operation: subtract
      name: mcu_cutout
    - operation: subtract
      name: link_cutout
  # Reference only (not cut): where the modules sit, to check fit in the viewer.
  modules:
  # RP2040-Zero, top edge flush with the PCB edge, USB-C facing up
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w, mcu_h]
  # its USB-C receptacle, sticking out about 1.8 mm past the board edge
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + 11.05]
    size: [9, 5.3]
  # USB-C breakout below the MCU, opening facing +x (towards the other half)
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [-usb_w / 2, link_y]
    size: [usb_w, usb_h]
  # M2 mounting holes, 2.5 mm outside the keycaps: two on the left edge, two along the
  # bottom, one in the electronics strip between the MCU and the USB-C breakout and one
  # beyond the thumb key's outer end. The PCB footprints below use the same positions.
  mount_holes:
  - what: circle
    where: matrix_outer_top
    radius: hole_d / 2
    adjust: &h_left_top
      shift: [-0.5kx - hole_off, 0]
  - what: circle
    where: mod_outer_thumb
    radius: hole_d / 2
    adjust: &h_left_bottom
      shift: [-0.5kx - hole_off, -0.5ky - hole_off]
  - what: circle
    where: mod_ring_thumb
    radius: hole_d / 2
    adjust: &h_bottom
      shift: [0.5kx, -0.5ky - hole_off]
  - what: circle
    where: matrix_inner_top
    radius: hole_d / 2
    adjust: &h_strip
      - *thumb_edge
      - shift: [led_x, 0.5py - mcu_h - usb_gap / 2]
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb
      - shift: [0.75kx + hole_off, 0]
      # then 3 mm to the right on the board (drop the key's rotation first)
      - ref: matrix_inner_top
        affect: r
      - shift: [3, 0]
  # above the ring column's top key (the top edge is raised there by mount_pad)
  - what: circle
    where: matrix_ring_top
    radius: hole_d / 2
    adjust: &h_ring
      shift: [0, 0.5ky + hole_off]
  # below the middle column's bottom key
  - what: circle
    where: matrix_middle_bottom
    radius: hole_d / 2
    adjust: &h_middle
      shift: [0, -0.5ky - hole_off]
  # below the right-most thumb key: past its lower (down-left facing) end
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb_low
      shift: [-0.75kx - hole_off, 0]
  # left of the USB-C breakout (its board starts 2.1 mm behind the pad row)
  - what: circle
    where: matrix_inner_top
    radius: hole_d / 2
    adjust: &h_link
      - *thumb_edge
      - shift: [link_x - 2.1 - hole_off - 0.5, link_y]
  # The key area of the board grown by cover_gap: the cover stays out of it.
  # (`expand` applies to everything built so far, so it gets its own outline.)
  cover_keepout:
    - name: board
      expand: cover_gap
  # The hole below the LED sits on the line between the cover and the switch plate, so
  # the cover gets a round tab around it and the plate a matching notch (cover_gap wider).
  cover_tab:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss
    adjust: *h_thumb
  cover_tab_clear:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss + cover_gap
    adjust: *h_thumb
  # Electronics cover. Footprint: the strip right of the inner column, minus the keys'
  # padded areas (so it stays 2 mm clear of the keycaps) and minus the key area of the
  # board plus cover_gap, so it never overlaps the switch plate.
  cover_area:
    - name: mcu_area
    - operation: intersect
      what: rectangle
      where: matrix_inner_top
      bound: false
      adjust:
        shift: [0.5px + 50, -50]
      size: [100, 200]
    - operation: subtract
      name: raw
    - operation: subtract
      name: cover_keepout
    - operation: add
      name: cover_tab
  # Solid bosses around the cover's three screw holes.
  cover_bosses:
  - what: circle
    where: matrix_inner_top
    radius: cover_boss
    adjust: *h_strip
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss
    adjust: *h_thumb
  - what: circle
    where: matrix_inner_top
    radius: cover_boss
    adjust: *h_link
  # Pocket under the lid: inset by the wall, opened out through the edge where the two
  # USB-C ports are (the module cutouts reach past the edge), minus the bosses.
  cover_pocket:
    - name: cover_area
      expand: -cover_wall
    - operation: add
      name: mcu_cutout
    - operation: add
      name: link_cutout
    - operation: subtract
      name: cover_bosses
  cover_base:
    - name: cover_area
    - operation: subtract
      name: cover_pocket
    - operation: subtract
      name: mount_holes
  cover_top:
    - name: cover_area
    - operation: subtract
      name: mount_holes
  # Top layer of the switch plate: the board outline with a switch cutout per key,
  # and the mounting holes.
  plate:
    - name: board
    - operation: subtract
      name: switch_cutouts
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Bottom (frame) layer of the switch plate: combo with the mounting holes (and the
  # notch for the cover's tab).
  frame:
    - name: combo
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Case outlines. The PCB's full shape (key area + electronics strip, without the module
  # cutouts, which would otherwise put wall material inside them), then grown outwards.
  _pcb_full:
    - name: board
    - operation: add
      name: mcu_area
  case_outer:
    - name: _pcb_full
      expand: case_off
  _case_inner:
    - name: _pcb_full
      expand: case_clear
  case_walls:
    - name: case_outer
    - operation: subtract
      name: _case_inner
  # Standoffs under every mounting hole, with a hole for an M2 heat-set insert.
  case_standoffs:
    - name: mount_holes
      expand: standoff_r - hole_d / 2
  case_inserts:
    - name: mount_holes
      expand: insert_r - hole_d / 2
  # Wall openings for the two USB-C plugs: the MCU's port on the top edge, the link
  # breakout's port on the right edge (towards the other half).
  case_usb_notches:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, 0.5py + 5]
    size: [usb_notch_w, 14]
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [5, link_y]
    size: [14, usb_notch_w]
pcbs:
  birdboard:
    template: kicad8
    outlines:
      main:
        outline: board_mcu
    footprints:
      # Gateron Low Profile 2.0 (KS-33) switches in Gateron LP hot-swap sockets.
      # Reversible: socket pads on both sides, so the same PCB works for either
      # hand (flip it over for the other half and fit the sockets on that side).
      switch:
        what: ceoloide/switch_gateron_ks27_ks33
        where: true
        params:
          side: B
          reversible: true
          hotswap: true
          solder: false
          include_keycap: true
          include_corner_marks: true
          include_socket_silks: true
          # One back-layer trace from the socket to the diode's pin-2 hole (diode
          # 5 mm above the switch centre, see `diode` below). Serves both socket sides.
          include_diode_trace: true
          diode_trace_end: [3.81, -5]
          # Front-layer column trace up to the next key in the column (see col_up).
          column_trace_up: "{{col_up}}"
          from: "{{column_net}}"
          to: "{{name}}"
      # One diode per key, column-to-row: anode on the switch, cathode on the row net.
      diode:
        what: diode_k8
        where: true
        adjust:
          shift: [0, 5]
        params:
          from: "{{name}}"
          to: "{{row_net}}"
          include_pad_links: true
      # Waveshare RP2040-Zero, castellated (SMD) pads on the back layer, not mirrored.
      # Mounted upside down from the bottom (left half as reference): component side up,
      # into mcu_cutout, so its USB-C port sits level with the PCB. One footprint serves
      # both halves: on the flipped right half the same assembly is just turned over.
      # Pins as seen from the top of the PCB. The switch matrix uses the side facing the
      # keys: all six GPIOs on the left edge for the columns, then the bottom row
      # (left to right) for the rows. LED and link use the bottom-right corner, next to
      # the breakout and the LED.
      #   left, top to bottom:  5V GND 3V3 | GP29=C0 GP28=C1 GP27=C2 GP26=C3 GP15=C4 GP14=C5
      #   bottom, left to right: GP13=R0 GP12=R1 GP11=R2 GP10=R3 GP9=LED
      #   right, bottom pin:     GP8=LINK
      mcu:
        what: mcu_rp2040_zero
        where:
          ref: matrix_inner_top
        adjust:
          - *thumb_edge
          - shift: [mcu_x, mcu_y]
        params:
          upside_down: true
          mount: smd
          GP29: C0
          GP28: C1
          GP27: C2
          GP26: C3
          GP15: C4
          GP14: C5
          GP13: R0
          GP12: R1
          GP11: R2
          GP10: R3
          GP9: LED
          GP8: LINK
      # 4-pin USB-C breakout (VBUS, D+ as single-wire serial, GND), opening toward the
      # other half. Like the MCU: one unmirrored footprint, mounted upside down from the
      # bottom with the receptacle facing up into link_cutout, so the port sits level
      # with the PCB. A straight 1x4 header goes through both boards at the pad row.
      link:
        what: usbc_breakout_4pin
        where:
          ref: matrix_inner_top
        adjust:
          - *thumb_edge
          - shift: [link_x, link_y]
        params:
          upside_down: true
          vbus: 5V
          dp: LINK
      # WS2812B status LEDs (5V supply, 3.3V data from GP9), one on each side of the
      # board at the same spot, both fitted. Chained: GP9 -> front LED -> back LED,
      # so each can be set on its own (LED 0 = front, LED 1 = back).
      led: &led
        what: led_ws2812b_5050
        where:
          ref: matrix_inner_top
        adjust:
          - *thumb_edge
          - shift: [led_x, led_y]
        params:
          side: F
          din: LED
          dout: LED_2
          vdd: 5V
      led_back:
        <<: *led
        params:
          side: B
          din: LED_2
          dout: LED_DOUT
          vdd: 5V
      # M2 mounting holes, at the same positions as the mount_holes outline.
      hole_left_top:
        what: mounting_hole
        where: matrix_outer_top
        adjust: *h_left_top
        params: {drill: hole_d}
      hole_left_bottom:
        what: mounting_hole
        where: mod_outer_thumb
        adjust: *h_left_bottom
        params: {drill: hole_d}
      hole_bottom:
        what: mounting_hole
        where: mod_ring_thumb
        adjust: *h_bottom
        params: {drill: hole_d}
      hole_strip:
        what: mounting_hole
        where: matrix_inner_top
        adjust: *h_strip
        params: {drill: hole_d}
      hole_thumb:
        what: mounting_hole
        where: thumbfan_home_thumb
        adjust: *h_thumb
        params: {drill: hole_d}
      hole_ring:
        what: mounting_hole
        where: matrix_ring_top
        adjust: *h_ring
        params: {drill: hole_d}
      hole_middle:
        what: mounting_hole
        where: matrix_middle_bottom
        adjust: *h_middle
        params: {drill: hole_d}
      hole_thumb_low:
        what: mounting_hole
        where: thumbfan_home_thumb
        adjust: *h_thumb_low
        params: {drill: hole_d}
      hole_link:
        what: mounting_hole
        where: matrix_inner_top
        adjust: *h_link
        params: {drill: hole_d}
      # ---- Column routes (front layer). Points are relative to matrix_inner_top. ----
      # The three thumbfan keys sit off their columns: each joins its column's bottom key.
      col_route_thumb_c3:
        what: trace
        where: matrix_inner_top
        params:
          net: C3
          points: [[-31.45, 64.15], [-31.45, 46.59], [-33.45, 44.59], [-42.25, 44.59], [-44.25, 42.59], [-44.25, 35.59]]
      col_route_thumb_c4:
        what: trace
        where: matrix_inner_top
        params:
          net: C4
          points: [[-11.56, 64.68], [-11.56, 47.09], [-13.56, 45.09], [-23.25, 45.09], [-25.25, 43.09], [-25.25, 41.2]]
      col_route_thumb_c5:

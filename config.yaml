meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
  # Extra board on the left and bottom edges for M2 mounting holes. With it the edge is
  # 5 mm past the keycaps, so a hole centred 2.5 mm out clears an M2 head (3.8 mm)
  # on the keycap side and keeps 2.5 mm to the board edge.
  mount_pad: 3
  hole_d: 2.2         # M2 clearance hole (PCB and plate)
  hole_off: 2.5       # hole centre distance outside the keycap edge
  # 3D-printed cover over the electronics strip (MCU, USB-C breakout), screwed on through
  # the strip's two mounting holes. It sits on the board top: a wall layer with a pocket for
  # the parts that stand above the board (the breakout's USB-C shell reaches about 1.6 mm),
  # then a solid lid.
  cover_wall: 1.5     # outer wall width
  cover_pocket: 2.5   # pocket depth (wall height): 1.6 mm parts + 0.9 mm clearance
  cover_lid: 1.5      # lid thickness on top (4 mm total)
  cover_boss: 3       # radius of the solid boss around each screw hole
  cover_gap: 0.3      # gap between the cover and the switch plate
  # v4: the FR4 PCB is replaced by a 3D-printed wiring board (`wireboard` case) that holds
  # the hot-swap sockets, the diodes and channels for hand-laid 22 AWG solid copper wire.
  # z = 0 is the board's back face, board_t its front face (the switches sit on the front).
  #   - back: socket pockets (so the switch pins see the same 1.6 mm as on FR4), column
  #     wires deep enough to lie on the socket tabs, row wires shallow, so a row passes
  #     over a column with a gap; each crossing gets a wider/deeper pocket for a sleeve
  #   - front: diode pockets and leg slots, plus a few channels under the MCU cover
  # The channels themselves are generated by wiring/build.js (see wiring/routes.js).
  board_t: 4          # wiring board thickness
  sock_floor: 1.6     # board left above the socket (same as the FR4 PCB, for the switch pins)
  sock_depth: board_t - sock_floor
  sock_tol: 0.2       # clearance around the socket body in its pocket
  diode_x: 7.2        # diode leg axis, right of the switch centre (beside the socket's right tab)
  diode_a: -5.75      # anode leg hole (level with the socket's right tab)
  diode_k: 4.41       # cathode leg hole: 10.16 mm leg pitch, the row wire runs through it
  diode_pocket_d: 2.1 # pocket depth for the 2 mm glass body
  diode_slot_d: 1.4   # leg slots from the body to the holes
  leg_hole_d: 1.0     # diode leg / wire hole
  link_pcb_t: 1.6     # USB-C breakout board thickness
  link_recess: 0.8    # breakout sits this far inside the back face (solder joints stay inside)
  link_pocket_d: link_pcb_t + link_recess
  # RP2040-Zero pocket: as deep as the breakout's, so both boards' component sides sit at
  # the same height and both USB-C ports end up level. Its 1 mm board is then recessed
  # 1.4 mm inside the back face; the wires drop onto it from the channel ends.
  mcu_pocket_d: link_pocket_d
  # Right half: the RP2040-Zero is flipped, lying in a front pocket (its board flush with the
  # front face) with its components down through mcu_cutout. Its pinout then mirrors with
  # the board, so both halves use the same pads.
  mcu_t: 1.0          # RP2040-Zero board thickness
  # Case: a tray the wiring board screws into (z = 0 is the bottom of the case). Stack:
  #   floor 1.5 | gap 1.1 under the board (sockets, MCU and breakout are all recessed into
  #   it) | wiring board 4 (top at 6.6) | switch plate 2.5 (top at 9.1) | cover 4 (top at
  #   10.6), so everything sits below the 11 mm wall.
  case_h: 11          # total wall height
  case_floor: 1.5     # floor thickness
  case_gap: 1.1       # floor to the board's back face (standoff height)
  pcb_t: board_t
  case_wall: 2        # wall thickness
  case_clear: 0.5     # gap between the PCB edge and the wall
  case_off: case_clear + case_wall
  standoff_r: 2.5     # standoff radius (5 mm)
  insert_r: 1.6       # hole for an M2 heat-set insert (3.2 mm)
  # USB-C port centre height: both boards' component sides sit link_pocket_d above the back
  # face and the ports are ~3.2 tall, so both ports share this height (level with the
  # board's top, as in v3).
  usb_z: case_floor + case_gap + link_pocket_d + 1.6
  # Right half (built with wiring/build.js, which uses this as usb_z there): the flipped
  # RP2040-Zero's port hangs down from its board, so it sits lower. Its wall opening is cut
  # down to suit, which also serves the breakout's port.
  usb_z_right: case_floor + case_gap + board_t - mcu_t - 1.6
  usb_notch_w: 13     # wall opening for a USB-C plug's overmould
  usb_notch_down: 3.5 # opening reaches this far below the port centre (open to the top)
  # Switch plate (Gateron LP 2.0 / KS-33 dimensional drawing)
  switch_cut: 14      # switch body at plate level: 14.00 +/- 0.03
  print_tol: 0.1      # extra clearance added to each cutout for 3D printing
  plate_t: 1.2        # plate thickness the switch clips are made for: 1.20 +/- 0.05
  frame_t: 1.3        # gap from plate underside to PCB (switch housing below the plate)
  # Electronics strip beside the inner column (MCU at the top, USB-C link below it).
  # Its right edge lines up with the thumb cluster's right-most corner, and it runs down
  # to meet the thumb cluster. x positions below are measured from that edge (negative
  # = inwards), y positions from the inner column's top key (matrix_inner_top).
  mcu_w: 18.3         # Waveshare RP2040-Zero board
  mcu_h: 23.9
  usb_w: 13.8         # 4-pin USB-C breakout: length along the cable direction
  usb_h: 12           #   and width
  usb_gap: 10         # space between the MCU and the breakout
  mcu_x: -11.5                                     # RP2040-Zero centre: its pads end 1.23 mm from the edge
  mcu_y: 0.5py - mcu_h / 2
  # Cutout under the upside-down MCU for its components (inside the pad ring, open at the top
  # so the USB-C port sits in the PCB edge). Pad inner edges: x +/-6.77, bottom row y 9.26.
  mcu_cut_w: 12.4                                  # 0.57 mm clear of the side pads
  mcu_cut_down: 8.75                               # from the module centre down to the cutout bottom
  mcu_cut_up: mcu_h / 2 + 2                        # from the module centre up, past the board edge
  link_x: -12.6                                    # breakout pad row: shell flush with the edge
  # Cutout under the upside-down breakout for its USB-C receptacle (open at the edge).
  # The breakout's 12 mm board rests on the PCB underside along both sides of it.
  link_cut_w: 9.6                                  # receptacle ~8.9 wide, so ~1.2 mm rests either side
  link_cut_start: 3                                # from the pad row forward to the cutout (2.1 mm clear of the pads)
  link_cut_len: 12.6 - link_cut_start + 2          # to the board edge, plus 2 past it
  link_y: 0.5py - mcu_h - usb_gap - usb_h / 2
  # Cover screw hole between the MCU and the breakout, near the strip's right edge so the
  # wires below the MCU can reach all of its bottom pads (the v3 LED is gone).
  strip_hole_x: -2.25
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      # Column nets C0-C5 run outer to inner.
      # Row nets: R0 top, R1 home, R2 bottom, R3 thumb (mod + thumbfan).
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key:
            stagger: 0.5ky
            column_net: C2
        middle:
          key.stagger: .25ky
          key.column_net: C3
        index:
          key.stagger: -.33ky
          key.column_net: C4
        inner:
          key.stagger: -.15ky
          key.column_net: C5
      # col_up: distance up to the next key in the same column, for the column trace
      # (0 = top of the column, its route to the MCU is a separate trace below).
      rows:
        bottom:
          row_net: R2
          col_up: 19
        home:
          row_net: R1
          col_up: 19
        top:
          row_net: R0
          col_up: 0
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      # Thumb row, first half: wired to the outer, pinky and ring columns.
      # col_up reaches the column's bottom key: 1.1ky, plus the ring column's 0.5ky stagger.
      columns:
        outer:
          key.column_net: C0
          key.col_up: 18.7
        pinky:
          key.column_net: C1
          key.col_up: 18.7
        ring:
          key.column_net: C2
          key.col_up: 27.2
      rows:
        thumb:
          row_net: R3
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      # Thumb row, second half: wired to the middle, index and inner columns.
      columns:
        outer:
          key.column_net: C3
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
          key.column_net: C4
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
            column_net: C5
      # Not stacked on their columns: routed by the col_route_thumb_* traces instead.
      rows:
        thumb:
          row_net: R3
          col_up: 0
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner (mount_pad: room for mounting holes on the left edge)
        - ref: matrix_outer_top
          shift: [-0.5px - mount_pad, 0.5py]
        # top-left corner, raised by mount_pad for the hole above the ring key
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py + mount_pad]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner
        - ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
        # bottom-most corner (added); pushed out along the key's length by mount_pad
        # (down and slightly left) so the bottom edge gets the same extra room
        - ref: thumbfan_home_thumb
          shift: [-0.75px - mount_pad, -0.5py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.5py - mount_pad]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.5px - mount_pad, -0.5py - mount_pad]
  combo:
    - name: board
    - operation: subtract
      name: keys
  # 14 x 14 mm switch cutouts (Gateron LP KS-33), plus a little print tolerance.
  switch_cutouts:
  - what: rectangle
    where: true
    bound: false
    size: [switch_cut + print_tol, switch_cut + print_tol]
  # Strip beside the inner column for the MCU and the USB-C link breakout. Its right
  # edge is vertical through the thumb cluster's right-most corner and runs down to
  # meet it; the other corners sit inside the key area so it merges with the board.
  # `thumb_edge` is an anchor step that keeps y but takes x from that corner.
  mcu_area:
  - what: polygon
    fillet: 2
    points:
      # top-left, on the board's top edge above the inner key
      - ref: matrix_inner_top
        shift: [0, 0.5py]
      # top-right: same height, x of the thumb corner
      - - ref: matrix_inner_top
          shift: [0, 0.5py]
        - &thumb_edge
          ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
          affect: x
      # the thumb cluster's right-most corner
      - ref: thumbfan_home_thumb
        shift: [0.75px, -0.5py]
      # along the board edge from that corner, then back through the keys
      - ref: thumbfan_home_thumb
        shift: [0, -0.5py]
      - ref: thumbfan_home_thumb
      - ref: matrix_inner_bottom
  # Open-topped cutout for the components of the upside-down RP2040-Zero.
  mcu_cutout:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + (mcu_cut_up - mcu_cut_down) / 2]
    size: [mcu_cut_w, mcu_cut_up + mcu_cut_down]
    corner: 1
  # Open-sided cutout for the receptacle of the upside-down USB-C breakout.
  link_cutout:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [link_x + link_cut_start + link_cut_len / 2, link_y]
    size: [link_cut_len, link_cut_w]
    corner: 1
  # PCB outline: the key area plus the electronics strip, minus the module cutouts.
  board_mcu:
    - name: board
    - operation: add
      name: mcu_area
    - operation: subtract
      name: mcu_cutout
    - operation: subtract
      name: link_cutout
  # Reference only (not cut): where the modules sit, to check fit in the viewer.
  modules:
  # RP2040-Zero, top edge flush with the PCB edge, USB-C facing up
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w, mcu_h]
  # its USB-C receptacle, sticking out about 1.8 mm past the board edge
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + 11.05]
    size: [9, 5.3]
  # USB-C breakout below the MCU, opening facing +x (towards the other half)
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [-usb_w / 2, link_y]
    size: [usb_w, usb_h]
  # M2 mounting holes, 2.5 mm outside the keycaps: two on the left edge, two along the
  # bottom, one in the electronics strip between the MCU and the USB-C breakout and one
  # beyond the thumb key's outer end.
  # (v4 drops v3's hole left of the breakout: the wires to the MCU's bottom pads run there.)
  mount_holes:
  - what: circle
    where: matrix_outer_top
    radius: hole_d / 2
    adjust: &h_left_top
      shift: [-0.5kx - hole_off, 0]
  - what: circle
    where: mod_outer_thumb
    radius: hole_d / 2
    adjust: &h_left_bottom
      shift: [-0.5kx - hole_off, -0.5ky - hole_off]
  - what: circle
    where: mod_ring_thumb
    radius: hole_d / 2
    adjust: &h_bottom
      shift: [0.5kx, -0.5ky - hole_off]
  - what: circle
    where: matrix_inner_top
    radius: hole_d / 2
    adjust: &h_strip
      - *thumb_edge
      - shift: [strip_hole_x, 0.5py - mcu_h - usb_gap / 2]
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb
      - shift: [0.75kx + hole_off, 0]
      # then 3 mm to the right on the board (drop the key's rotation first)
      - ref: matrix_inner_top
        affect: r
      - shift: [3, 0]
  # above the ring column's top key (the top edge is raised there by mount_pad)
  - what: circle
    where: matrix_ring_top
    radius: hole_d / 2
    adjust: &h_ring
      shift: [0, 0.5ky + hole_off]
  # below the middle column's bottom key
  - what: circle
    where: matrix_middle_bottom
    radius: hole_d / 2
    adjust: &h_middle
      shift: [0, -0.5ky - hole_off]
  # below the right-most thumb key: past its lower (down-left facing) end
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb_low
      shift: [-0.75kx - hole_off, 0]
  # The key area of the board grown by cover_gap: the cover stays out of it.
  # (`expand` applies to everything built so far, so it gets its own outline.)
  cover_keepout:
    - name: board
      expand: cover_gap
  # The hole below the LED sits on the line between the cover and the switch plate, so
  # the cover gets a round tab around it and the plate a matching notch (cover_gap wider).
  cover_tab:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss
    adjust: *h_thumb
  cover_tab_clear:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss + cover_gap
    adjust: *h_thumb
  # Electronics cover. Footprint: the strip right of the inner column, minus the keys'
  # padded areas (so it stays 2 mm clear of the keycaps) and minus the key area of the
  # board plus cover_gap, so it never overlaps the switch plate.
  cover_area:
    - name: mcu_area
    - operation: intersect
      what: rectangle
      where: matrix_inner_top
      bound: false
      adjust:
        shift: [0.5px + 50, -50]
      size: [100, 200]
    - operation: subtract
      name: raw
    - operation: subtract
      name: cover_keepout
    - operation: add
      name: cover_tab
  # Solid bosses around the cover's three screw holes.
  cover_bosses:
  - what: circle
    where: matrix_inner_top
    radius: cover_boss
    adjust: *h_strip
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss
    adjust: *h_thumb
  # Pocket under the lid: inset by the wall, opened out through the edge where the two
  # USB-C ports are (the module cutouts reach past the edge), minus the bosses.
  cover_pocket:
    - name: cover_area
      expand: -cover_wall
    - operation: add
      name: mcu_cutout
    - operation: add
      name: link_cutout
    - operation: subtract
      name: cover_bosses
  cover_base:
    - name: cover_area
    - operation: subtract
      name: cover_pocket
    - operation: subtract
      name: mount_holes
  cover_top:
    - name: cover_area
    - operation: subtract
      name: mount_holes
  # Top layer of the switch plate: the board outline with a switch cutout per key,
  # and the mounting holes.
  plate:
    - name: board
    - operation: subtract
      name: switch_cutouts
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Bottom (frame) layer of the switch plate: combo with the mounting holes (and the
  # notch for the cover's tab).
  frame:
    - name: combo
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Case outlines. The PCB's full shape (key area + electronics strip, without the module
  # cutouts, which would otherwise put wall material inside them), then grown outwards.
  _pcb_full:
    - name: board
    - operation: add
      name: mcu_area
  case_outer:
    - name: _pcb_full
      expand: case_off
  _case_inner:
    - name: _pcb_full
      expand: case_clear
  case_walls:
    - name: case_outer
    - operation: subtract
      name: _case_inner
  # Standoffs under every mounting hole, with a hole for an M2 heat-set insert.
  case_standoffs:
    - name: mount_holes
      expand: standoff_r - hole_d / 2
  case_inserts:
    - name: mount_holes
      expand: insert_r - hole_d / 2
  # Wall openings for the two USB-C plugs: the MCU's port on the top edge, the link
  # breakout's port on the right edge (towards the other half).
  case_usb_notches:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, 0.5py + 5]
    size: [usb_notch_w, 14]
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [5, link_y]
    size: [14, usb_notch_w]
  # ---- v4 wiring board (printed). Positions are in each key's own frame (y up). ----
  # Gateron LP HS 2.0 socket (KS-2P02B01-02) on the back, as in the switch footprint's
  # B.Fab outline: two body blocks, the column tab (left) and the diode tab (right). The
  # right tab's pocket runs on to the anode leg hole, so the leg comes out beside the tab.
  # Through holes: switch centre post, the socket's two pin holes, both diode legs.
  _wb_key_holes:
  - what: circle
    where: true
    radius: 2.6
  - what: circle
    where: true
    radius: 1.55
    adjust: {shift: [-4.4, -4.7], resist: true}
  - what: circle
    where: true
    radius: 1.55
    adjust: {shift: [2.6, -5.75], resist: true}
  - what: circle
    where: true
    radius: leg_hole_d / 2
    adjust: {shift: [diode_x, diode_a], resist: true}
  - what: circle
    where: true
    radius: leg_hole_d / 2
    adjust: {shift: [diode_x, diode_k], resist: true}
  _wb_sockets:
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [-3.8125, -4.7], resist: true}
    size: [6.025 + 2 sock_tol, 4.35 + 2 sock_tol]
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [1.1625, -5.75], resist: true}
    size: [7.725 + 2 sock_tol, 4.35 + 2 sock_tol]
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [-7.6375, -4.7], resist: true}
    size: [1.625 + 2 sock_tol, 1.75 + 2 sock_tol]
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [(5.025 + diode_x + 0.7) / 2, -5.75], resist: true}
    size: [diode_x + 0.7 - 5.025 + 2 sock_tol, 1.75 + 2 sock_tol]
  # DO-35 body (2 x 4 mm) on the front, sunk below the surface the switch sits on, and slots
  # for its legs out to the two holes.
  _wb_diode_body:
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [diode_x, (diode_a + diode_k) / 2], resist: true}
    size: [2.4, 4.6]
  _wb_diode_slots:
  - what: rectangle
    where: true
    bound: false
    adjust: {shift: [diode_x, (diode_a + diode_k) / 2], resist: true}
    size: [0.9, diode_k - diode_a]
  # RP2040-Zero (upside down, component side up, as in v3) in a back pocket as deep as the
  # breakout's (mcu_pocket_d).
  _wb_mcu_pocket:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w + 0.3, mcu_h + 0.3]
  # USB-C breakout (upside down, receptacle up into link_cutout) in a back pocket, from
  # 2.3 mm behind its pad row out past the board edge.
  _wb_link_pocket:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [(link_x - 2.3 + 1) / 2, link_y]
    size: [1 - (link_x - 2.3), usb_h + 0.4]
cases:
  # 3D-printable switch plate, sitting directly on the PCB (z = 0 is the PCB top).
  #   - frame: the combo outline (keycap-sized openings), frame_t thick, fills the
  #     gap between PCB and plate and stiffens it; clears the switch's lower housing
  #   - plate: plate_t thick on top, with 14 mm switch cutouts for the clips
  # Print it upside down (plate layer on the bed) for a flat top surface.
  switchplate:
    - what: outline
      name: frame
      extrude: frame_t
    - what: outline
      name: plate
      extrude: plate_t
      shift: [0, 0, frame_t]
      operation: add
  # Keyboard case (z = 0 is the case bottom): floor, 11 mm walls with openings for both
  # USB-C plugs, and standoffs with M2 heat-set insert holes under all mounting holes.
  # The PCB sits on the standoffs; the switch plate and the cover fit inside the walls.
  # This is the left half; wiring/build.js also writes keyboard_case_right (and the other
  # cases with _right) from a mirrored run, with its port openings at usb_z_right.
  keyboard_case:
    - what: outline
      name: case_outer
      extrude: case_floor
    - what: outline
      name: case_walls
      extrude: case_h
      operation: add
    - what: outline
      name: case_standoffs
      extrude: case_floor + case_gap
      operation: add
    - what: outline
      name: case_inserts
      extrude: case_h
      operation: subtract
    - what: outline
      name: case_usb_notches
      extrude: case_h
      shift: [0, 0, usb_z - usb_notch_down]
      operation: subtract
  # Cover for the MCU, the USB-C breakout and the front wires between them (z = 0 is the
  # board top). Screws through the two strip holes (between the MCU and the breakout, and
  # beyond the thumb key). Print it upside down (lid on the bed).
  mcu_cover:
    - what: outline
      name: cover_base
      extrude: cover_pocket
    - what: outline
      name: cover_top
      extrude: cover_lid
      shift: [0, 0, cover_pocket]
      operation: add
  # v4 wiring board without its wire channels (z = 0 is the back face). wiring/build.js
  # adds the channels and writes output/cases/wireboard_left.jscad and, from a mirrored
  # run of this config, wireboard_right.jscad (and .stl); the bases on their own are not
  # written out. Cuts reach 1 mm past the faces they open onto, so no zero-thickness
  # skins are left behind. The two halves differ only in the MCU pocket.
  _wireboard_common:
    - what: outline
      name: board_mcu
      extrude: board_t
    - what: outline
      name: mount_holes
      extrude: board_t + 2
      shift: [0, 0, -1]
      operation: subtract
    - what: outline
      name: _wb_key_holes
      extrude: board_t + 2
      shift: [0, 0, -1]
      operation: subtract
    - what: outline
      name: _wb_sockets
      extrude: sock_depth + 1
      shift: [0, 0, -1]
      operation: subtract
    - what: outline
      name: _wb_diode_body
      extrude: diode_pocket_d + 1
      shift: [0, 0, board_t - diode_pocket_d]
      operation: subtract
    - what: outline
      name: _wb_diode_slots
      extrude: diode_slot_d + 1
      shift: [0, 0, board_t - diode_slot_d]
      operation: subtract
    - what: outline
      name: _wb_link_pocket
      extrude: link_pocket_d + 1
      shift: [0, 0, -1]
      operation: subtract
  # left: RP2040-Zero in a back pocket, component side up
  wireboard_base:
    - what: case
      name: _wireboard_common
    - what: outline
      name: _wb_mcu_pocket
      extrude: mcu_pocket_d + 1
      shift: [0, 0, -1]
      operation: subtract
  # right: RP2040-Zero flipped, in a front pocket, its board flush with the front face
  wireboard_base_right:
    - what: case
      name: _wireboard_common
    - what: outline
      name: _wb_mcu_pocket
      extrude: mcu_t + 1
      shift: [0, 0, board_t - mcu_t]
      operation: subtract

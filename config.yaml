meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
  # Extra board on the left and bottom edges for M2 mounting holes. With it the edge is
  # 5 mm past the keycaps. The holes sit close to the keys: 1.9 mm past the key outline
  # (2.15 mm past the keycap edge) still clears an M2 head (3.8 mm), and leaves 3.1 mm to
  # the board edge, so the moose's head line on the underside runs past without bending
  # round them.
  mount_pad: 3
  hole_d: 2.2         # M2 clearance hole (plate)
  hole_off: 1.9       # hole centre distance outside the key outline
  # the two holes at the ends of the inner thumb key sit closer still: the board's corner
  # there is sharper, and the head line needs 3 mm from the upper one
  thumb_hole_off: 1.5
  # v4.6: handwired, as in the Scotto44. There is no PCB or wiring board: the switches clip
  # into a printed plate, and the diodes and 18 AWG solid copper wire are soldered straight
  # onto the switch pins underneath (wiring/build.js draws the guide). Two pods stick out of
  # the top corners of the key area, each holding a module on the case floor with its USB-C
  # port out of the top wall: the RP2040-Zero (to the computer) left of the outer column's
  # top key, and the USB-C breakout (the link to the other half) right of the inner column's.
  # The plate runs on, solid, over both pods.
  # Case (z = 0 is the bottom of the case). Stack:
  #   floor 1.5 | wiring space 5.5 (switch pins, diodes, wires; the modules on the floor)
  #   | switch plate 2.5 (top at 9.5) | wall to 11.
  case_floor: 1.6     # floor thickness
  wire_gap: 5.5       # floor to the plate's underside (standoff height above the floor)
  frame_t: 1.3        # plate's lower (frame) layer: room for the switch housing below the clips
  plate_t: 1.2        # plate thickness the switch clips are made for: 1.20 +/- 0.05
  plate_z: case_floor + wire_gap                   # underside of the plate
  case_h: plate_z + frame_t + plate_t              # wall height: flush with the plate's top
  case_wall: 2        # wall thickness
  case_clear: 0.05    # gap between the plate edge and the wall
  case_off: case_clear + case_wall
  case_chamfer: 0.8   # 45 degree chamfer round the case's bottom edge (wiring/build.js)
  lip_w: 1.2          # a lip round the inside of the wall that the plate's edge rests on: its
                      #   top at the plate's underside, this wide, with a 45 degree underside
                      #   (wiring/build.js)
  standoff_r: 2.5     # standoff radius at its top, under the plate (5 mm)
  standoff_flare: 10  # its outside widens downwards at this many degrees a side, to the floor
                      #   (wiring/build.js)
  insert_r: 1.6       # hole for an M2 heat-set insert (3.2 mm at the standoff's top), blind
  insert_taper: 10    # its inside narrows downwards at this many degrees a side (wiring/build.js)
  insert_r_min: 1.1   #   down to this radius (2.2 mm, clear of the M2 screw), then runs straight
  # Switch plate (Gateron LP 2.0 / KS-33 dimensional drawing)
  switch_cut: 13.9      # switch body at plate level: 14.00 +/- 0.03
  print_tol: 0        # extra clearance added to each switch cutout for 3D printing (at 0.1 the
                      # printed holes were 0.1 mm loose each way)
  # Modules (both component side up, USB-C port at the top edge, pointing out of the top)
  mcu_w: 18.3         # Waveshare RP2040-Zero board
  mcu_h: 23.9
  mcu_t: 1.0          # its board thickness
  # Status-light tube (RP2040-Zero's LED): a hollow tube under the plate holds a short piece of
  # clear 1.75 mm filament, flush with the plate's top, as a light pipe from the LED up.
  led_x: 0            # LED centre across the board, from its centre (centred)
  led_y: -mcu_h / 2 + 8  # and up the board from its centre (8 mm in from the end away from the USB)
  led_h: 1                # LED height above the board's top face
  led_clear: 1.5      # gap between the LED's top and the tube's bottom
  led_bore: 1.85      # bore for 1.75 mm filament: tight press fit, tune after a test print
  led_wall: 1.2       # tube wall
  led_tube_z: case_floor + mcu_t + led_h + led_clear   # tube's bottom, from the case bottom
  led_tube_len: plate_z - led_tube_z                   # how far it hangs below the plate
  # BOOT and RESET buttons: paperclip holes in the plate over them, each with a guide tube
  # under the plate. Button centres are 7.5 mm up from the board's end away from the USB-C and
  # 4 mm in from each side; RESET is the right one (USB-C up), with a groove ring round its hole.
  btn_y: -mcu_h / 2 + 7.5      # up the board from its centre
  btn_dx: mcu_w / 2 - 4        # each side of its centre line
  btn_h: 2.6                   # button height above the board's top face
  btn_clear: 1                 # gap between the button's top and the tube's bottom (paperclip travel)
  btn_hole: 1.4                # paperclip hole
  btn_wall: 1.2                # guide tube wall
  btn_tube_z: case_floor + mcu_t + btn_h + btn_clear   # tube's bottom, from the case bottom
  btn_tube_len: plate_z - btn_tube_z                   # how far it hangs below the plate
  ring_gap: 0.8                # RESET ring: from the hole's edge to the groove
  ring_w: 0.5                  #   groove width
  ring_depth: 0.3              #   groove depth into the plate's top
  # +1, or -1 in the mirrored (right half) run (wiring/build.js): the mirrored run flips every
  # shift, but the board is not mirrored, so the RESET ring's shift is flipped back with this
  mirror_sign: 1
  usb_w: 13.8         # 4-pin USB-C breakout: length along the cable direction (up the board)
  usb_h: 12           #   and width
  link_pcb_t: 1.6     #   and board thickness (receptacle on top)
  # Seats on the case floor: a low rim round three sides of each module (open at the top,
  # where its port faces the wall), with a little clearance. Stick the modules down with
  # double-sided tape.
  seat_tol: 0.3       # clearance round each module
  seat_rim: 1.2       # rim width
  seat_h: 2           # rim height above the floor
  # Pods: room round each seat (pod_side on each side and below), top flush with the key
  # area's top edge, overlapping it by pod_overlap so the outlines merge.
  pod_side: seat_tol + seat_rim + 0.5
  pod_overlap: 8 # was 1, set to 2 to stop the funky dips
  # MCU pod, left of the outer column's top key (positions from matrix_outer_top)
  mcu_pod_w: mcu_w + 2 pod_side
  mcu_pod_h: mcu_h + pod_side
  mcu_pod_in: 3.9     # the pod moved in toward the keys: until the module's pocket is 0.2 mm
                      #   from the standoff_r column of the mounting hole beside the top key. The seat's
                      #   rim runs into the standoff, and the standoff's flare is trimmed clear
                      #   of the pocket (wiring/build.js), as in the breakout's pod
  mcu_cx: -0.5px - mount_pad - mcu_pod_w / 2 + mcu_pod_in   # module centre
  mcu_cy: 0.5py - mcu_h / 2
  # Breakout pod, right of the inner column's top key (positions from matrix_inner_top),
  # with a mounting hole below the breakout
  link_pod_w: usb_h + 2 pod_side
  link_pod_h: usb_w + pod_side + 7
  link_cx: 0.5px + link_pod_w / 2                  # module centre
  link_cy: 0.5py - usb_w / 2
  # USB-C port centre heights: each receptacle (~3.2 tall) sits on its board on the floor.
  usb_z_mcu: case_floor + mcu_t + 1.6
  usb_z_link: case_floor + link_pcb_t + 1.6
  usb_port_w: 8.94    # a USB-C receptacle's width
  usb_port_clear: 0.5 # clearance either side of it in the wall opening
  usb_notch_w: usb_port_w + 2 usb_port_clear       # wall opening's width (9.94)
  usb_notch_down: 3.3 # opening reaches this far below the port centre (open to the top)
  # Keycaps (art/keycaps.js): low profile, for the KS-33's MX-style cross stem, one piece,
  # printed top down with the flat face on the bed. The skirt ends level with the bottom of the
  # stem post, and the post rides on the switch's slider, so the skirt can't reach the housing
  # or the plate at bottom-out.
  cap_pitch: 19       # key spacing; a cap is this wide per unit, less cap_gap
  cap_gap: 1          # between neighbouring caps
  cap_draft: 0.9      # the top is this much smaller than the bottom on every side
  cap_top_t: 1.2      # top thickness
  cap_skirt: 3.3      # skirt height below the top, the same as the stem's length
  cap_wall: 1.6       # skirt thickness
  cap_r_bottom: 1   # corner radius at the skirt's bottom edge
  cap_r_top: 2      #   and at the top
  cap_post_d: 5.4     # stem post: fits in the switch's 5.7 mm stem well
  cap_cross: 4.0      # the switch's cross: arm length
  cap_cross_w: 1.1    #   and arm width
  cap_stem_tol: 0.2   # socket clearance on each dimension of the cross (found with a fit test)
  cap_socket: 3.0     # socket depth, from the post's bottom
  cap_face_chamfer: 0.8   # the face's edge is chamfered this much, at 45 degrees
  # keycap_1u_homing (for F and J) has a homing groove cut into its face: a rounded bar
  # cap_homing_len long, cap_homing_r round, cap_homing_depth deep, cap_homing_in from the front
  cap_seat: 3         # viewer only: the caps' skirt bottom above the plate's top on an
                      #   unpressed switch, for the assembled view (an estimate)
  cap_homing_len: 5
  cap_homing_r: 0.6
  cap_homing_in: 2.5
  cap_homing_depth: 0.4
  # Chicago-style caps (keycap_cs_*): the same footprint and stem, with the side profiles in
  # art/cs_profiles.json (traced from art/cs_profiles.png by art/trace-profile.js) running
  # across the width. Printed on the left side, so every layer is the profile.
  cap_cs_edge: 0.6    # 45 degree chamfer along the top's left and right edges
  cap_cs_dish: 0.8    # a shallow dip in the middle of the top: this deep at the centre, easing
                      #   to nothing at the left and right edges and the front and back
                      #   (0 for a flat top). The hollow drops to match, so the top keeps cap_top_t.
  cap_cs_dish_cols: 16  #   strips across the width the dished top is built from
  cap_cs_thumb_corner_r: 3  # the 1.5u thumb cap's swept end: its two corners rounded this
                      #   radius, seen from above
  # Built-in supports for the Chicago caps (the keycap_cs_*_supported files): a scaffold beside
  # the cap, a separate solid that touches it nowhere. A round-ended baseplate on the bed, straight
  # leaning struts from it into the cap's open end, wide and round at the bed and tapering
  # evenly as they rise, and a fan of tines, thick where they split off and tapering evenly to
  # their ends, that stop sup_gap short of the stem post's underside and of the hollow's
  # ceiling (break-off gap: 0.08 mm is one layer).
  sup_gap: 0.08       # gap between a tine's end and the cap
  sup_w: 0.8          # tine end width
  sup_tine_root_w: 1.2  # a tine's width where it splits off the strut (tapering evenly to sup_w)
  sup_tines: 3        # tines in each fan
  sup_tine_pitch: 1.1 #   and their spacing along the post's length / the ceiling's depth (a fan standing up from the baseplate)
  sup_foot_w: 5       # a strut's width where it stands on the bed (its foot is cut flat there)
  sup_arm_w: 1.6      #   and at the top, where its tines split off (it tapers evenly between)
  sup_plate_t: 1.2    # baseplate thickness (15 layers at 0.08)
  sup_plate_w: 8      #   its width across the cap's depth (and the diameter of its round ends)
  sup_plate_pad: 2.5  #   how far it runs past each strut's foot (at least the foot's own reach)
  sup_lean: 30        # a strut's lean from the vertical, degrees: more is a wider, stabler stance and longer struts
  sup_clear: 1.3      # a strut's end stays this far outside the cap's open end
  sup_overhang_ok: 2  # a sloping ceiling (the 1.5u thumb cap's) gets no tines if it overhangs past
                      #   45 degrees for less than this (mm, along it)
  sup_fan: 1          # a fan's root is this far below its tines' ends
  cap_cs_print_slope: 30    # keymap planner only: the face is shaded where it's steeper than
                            #   this (degrees), as a UV-printed legend lands stretched there
  cap_cs_homing_bump: 0.6   # keycap_cs_home_1u_homing: a rounded bar standing this proud of
                            #   the face (cap_homing_len long, cap_homing_r round, cap_homing_in
                            #   from the front edge)
  # Holder for UV printing the legends on the eufyMake E1: one half's caps at a time, top up,
  # sized for the E1's mini flatbed (a 330 x 90 mm strip): three long rows of slots, 219 x 81 mm.
  # The build stops if the holder comes out bigger than the bed.
  holder_pitch: 23    # slot spacing per unit
  holder_cols: 9      # 1u slots per row (24.5 units of caps: 9 + 9 + 6.5)
  holder_bed_w: 330   # the bed it has to fit on: length
  holder_bed_d: 90    #   and depth (mini flatbed; the standard one is 420 x 330)
  holder_clear: 0.25  # pocket clearance round each cap's bottom edge
  holder_pocket: 2.4  # pocket depth (the cap sits on the pocket floor by its skirt)
  holder_floor: 2     # under the pockets
  holder_margin: 6    # round the slots
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      # Column nets C0-C5 run outer to inner.
      # Row nets: R0 top, R1 home, R2 bottom, R3 thumb (mod + thumbfan).
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key:
            stagger: 0.5ky
            column_net: C2
        middle:
          key.stagger: .25ky
          key.column_net: C3
        index:
          key.stagger: -.33ky
          key.column_net: C4
        inner:
          key.stagger: -.15ky
          key.column_net: C5
      # col_up: distance up to the next key in the same column, for the column trace
      # (0 = top of the column, its route to the MCU is a separate trace below).
      rows:
        bottom:
          row_net: R2
          col_up: 19
        home:
          row_net: R1
          col_up: 19
        top:
          row_net: R0
          col_up: 0
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      # Thumb row, first half: wired to the outer, pinky and ring columns.
      # col_up reaches the column's bottom key: 1.1ky, plus the ring column's 0.5ky stagger.
      columns:
        outer:
          key.column_net: C0
          key.col_up: 18.7
        pinky:
          key.column_net: C1
          key.col_up: 18.7
        ring:
          key.column_net: C2
          key.col_up: 27.2
      rows:
        thumb:
          row_net: R3
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      # Thumb row, second half: wired to the middle, index and inner columns.
      columns:
        outer:
          key.column_net: C3
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
          key.column_net: C4
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
            column_net: C5
      # Not stacked on their columns: routed by the col_route_thumb_* traces instead.
      rows:
        thumb:
          row_net: R3
          col_up: 0
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  # The key area.
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner (mount_pad: room for mounting holes on the left edge)
        - ref: matrix_outer_top
          shift: [-0.4px - mount_pad, 0.5py]
        # top-left corner, raised by mount_pad for the hole above the ring key
        # - ref: matrix_ring_top
        #   shift: [-0.5px, 0.5py + mount_pad]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.55px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.55px, -.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner; pushed out along the key's length by mount_pad, like the
        # bottom-most one, for the hole past the key's upper end
        - ref: thumbfan_home_thumb
          shift: [0.6px + mount_pad, -0.5py]
        # bottom-most corner (added); pushed out along the key's length by mount_pad
        # (down and slightly left) so the bottom edge gets the same extra room
        - ref: thumbfan_home_thumb
          shift: [-0.6px - mount_pad, -0.5py]
        - ref: thumbfan_fn_thumb
          shift: [.4px, -0.55py]
        - ref: thumbfan_outer_thumb
          shift: [.42px, -0.55py]
        - ref: thumbfan_outer_thumb
          shift: [-.42px, -0.55py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.4py - mount_pad]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.4px - mount_pad, -0.4py - mount_pad]
  combo:
    - name: board
    - operation: subtract
      name: keys
  # 14 x 14 mm switch cutouts (Gateron LP KS-33), plus a little print tolerance.
  switch_cutouts:
  - what: rectangle
    where: true
    bound: false
    size: [switch_cut + print_tol, switch_cut + print_tol]
  # Pods for the two modules, merged into the key area at its top corners.
  pods:
  - what: rectangle
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx + pod_overlap / 2, 0.53py - mcu_pod_h / 2]
    size: [mcu_pod_w + pod_overlap, mcu_pod_h]
    corner: 2
  - what: rectangle
    operation: add
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx - pod_overlap / 2, 0.52py - link_pod_h / 2]
    size: [link_pod_w + pod_overlap, link_pod_h]
    corner: 2
  # Status-light tube: its outside, and the bore for the filament.
  led_tube:
  - what: circle
    where: matrix_outer_top
    radius: led_bore / 2 + led_wall
    adjust:
      shift: [mcu_cx + led_x, mcu_cy + led_y]
  led_hole:
  - what: circle
    where: matrix_outer_top
    radius: led_bore / 2
    adjust:
      shift: [mcu_cx + led_x, mcu_cy + led_y]
  # BOOT and RESET paperclip holes: guide tubes, holes, and the groove ring round RESET (right).
  btn_tubes:
  - what: circle
    where: matrix_outer_top
    radius: btn_hole / 2 + btn_wall
    adjust:
      shift: [mcu_cx - btn_dx, mcu_cy + btn_y]
  - what: circle
    operation: add
    where: matrix_outer_top
    radius: btn_hole / 2 + btn_wall
    adjust:
      shift: [mcu_cx + btn_dx, mcu_cy + btn_y]
  btn_holes:
  - what: circle
    where: matrix_outer_top
    radius: btn_hole / 2
    adjust:
      shift: [mcu_cx - btn_dx, mcu_cy + btn_y]
  - what: circle
    operation: add
    where: matrix_outer_top
    radius: btn_hole / 2
    adjust:
      shift: [mcu_cx + btn_dx, mcu_cy + btn_y]
  reset_ring:
  - what: circle
    where: matrix_outer_top
    radius: btn_hole / 2 + ring_gap + ring_w
    adjust:
      shift: [mcu_cx + btn_dx * mirror_sign, mcu_cy + btn_y]
  - what: circle
    operation: subtract
    where: matrix_outer_top
    radius: btn_hole / 2 + ring_gap
    adjust:
      shift: [mcu_cx + btn_dx * mirror_sign, mcu_cy + btn_y]
  # Everything inside the case walls: the key area and the two pods. Also the plate's outline.
  _inside:
    - name: board
    - operation: add
      name: pods
  # The moose's head line on the underside (art/moose.js): along the key area's edge, 2.5 mm
  # inside the case edge, so it stays clear of the bottom chamfer.
  _head:
    - name: board
  # Reference only (not cut): where the modules sit, to check fit in the viewer.
  modules:
  # RP2040-Zero, top edge on the pod's top edge, USB-C facing up
  - what: rectangle
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, mcu_cy]
    size: [mcu_w, mcu_h]
  # its USB-C receptacle, sticking out about 1.8 mm past the top edge
  - what: rectangle
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, mcu_cy + 11.05]
    size: [usb_port_w, 5.3]
  # USB-C breakout, opening facing up
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx, link_cy]
    size: [usb_h, usb_w]
  # Floor seats for the two modules: a rim round each, open at the top (where its port is).
  module_seats:
  - what: rectangle
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, mcu_cy]
    size: [mcu_w + 2 seat_tol + 2 seat_rim, mcu_h + 2 seat_tol + 2 seat_rim]
  - what: rectangle
    operation: subtract
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, mcu_cy]
    size: [mcu_w + 2 seat_tol, mcu_h + 2 seat_tol]
  - what: rectangle
    operation: subtract
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, mcu_cy + mcu_h / 2 + 5]
    size: [mcu_w + 10, 10]
  - what: rectangle
    operation: add
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx, link_cy]
    size: [usb_h + 2 seat_tol + 2 seat_rim, usb_w + 2 seat_tol + 2 seat_rim]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx, link_cy]
    size: [usb_h + 2 seat_tol, usb_w + 2 seat_tol]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx, link_cy + usb_w / 2 + 5]
    size: [usb_h + 10, 10]
  # M2 mounting holes, 2.5 mm outside the keycaps: two on the left edge, one above the ring
  # key, three along the bottom and one in the breakout's pod.
  mount_holes:
  - what: circle
    where: matrix_outer_top
    radius: hole_d / 2
    adjust:
      shift: [-0.4kx - hole_off, 0.4ky + hole_off]
  - what: circle
    where: mod_outer_thumb
    radius: hole_d / 2
    adjust:
      shift: [-0.4kx - hole_off, -0.4ky - hole_off]
  # on the left edge, halfway between the two above (beside the outer column's bottom key)
  - what: circle
    where: matrix_outer_bottom
    radius: hole_d / 2
    adjust:
      shift: [-0.4kx - hole_off, .57ky]
  - what: circle
    where: mod_ring_thumb
    radius: hole_d / 2
    adjust:
      shift: [0.4kx + hole_off, -0.4ky - hole_off]
  # above the ring column's top key (the top edge is raised there by mount_pad)
  - what: circle
    where: matrix_ring_top
    radius: hole_d / 2
    adjust:
      shift: [0, 0.5ky + hole_off]
  # below the middle column's bottom key
  - what: circle
    where: matrix_middle_bottom
    radius: hole_d / 2
    adjust:
      shift: [0, -0.5ky - hole_off]
  # below the right-most thumb key: past its lower (down-left facing) end
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust:
      shift: [-0.6kx - thumb_hole_off, 0]
  # above the right-most thumb key: past its upper end, mirroring the one below it
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust:
      shift: [0.6kx + thumb_hole_off, 0]
  # in the breakout's pod, below the breakout
  - what: circle
    where: matrix_inner_top
    radius: hole_d / 2
    adjust:
      shift: [0.6kx - thumb_hole_off, 0.6ky - thumb_hole_off]
  # Top layer of the switch plate: the key area and the pods, with a switch cutout per key
  # and the mounting holes.
  plate:
    - name: _inside
    - operation: subtract
      name: switch_cutouts
    - operation: subtract
      name: mount_holes
  # Bottom (frame) layer of the switch plate: ribs between the keys, solid over the pods.
  frame:
    - name: _inside
    - operation: subtract
      name: keys
    - operation: subtract
      name: mount_holes
  # Case outlines: everything inside, grown outwards.
  case_outer:
    - name: _inside
      expand: case_off
  _case_inner:
    - name: _inside
      expand: case_clear
  case_walls:
    - name: case_outer
    - operation: subtract
      name: _case_inner
  # Wall openings for the two USB-C plugs, both in the top wall. Each starts at the inside
  # of the wall, so the floor inside the case stays whole.
  usb_notch_mcu:
  - what: rectangle
    where: matrix_outer_top
    bound: false
    adjust:
      shift: [mcu_cx, 0.5py + case_clear + 7]
    size: [usb_notch_w, 14]
  usb_notch_link:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      shift: [link_cx, 0.5py + case_clear + 7]
    size: [usb_notch_w, 14]
cases:
  # 3D-printable switch plate (z = 0 is its underside), screwed onto the case standoffs.
  #   - frame: ribs between the keycap-sized openings, frame_t thick (solid over the pods);
  #     stiffens the plate and clears the switch's lower housing
  #   - plate: plate_t thick on top, with 14 mm switch cutouts for the clips
  # Print it upside down (plate layer on the bed) for a flat top surface.
  switchplate:
    - what: outline
      name: frame
      extrude: frame_t
    - what: outline
      name: plate
      extrude: plate_t
      shift: [0, 0, frame_t]
      operation: add
    # Tubes down from the underside (the status light's, and a guide for each paperclip hole),
    # all added first, then: the LED bore, a paperclip hole for each button (both open and
    # flush on top; the bores run 1 mm past the top so no skin is left) and the RESET ring,
    # a groove in the top face.
    - what: outline
      name: led_tube
      extrude: led_tube_len
      shift: [0, 0, -led_tube_len]
      operation: add
    - what: outline
      name: btn_tubes
      extrude: btn_tube_len
      shift: [0, 0, -btn_tube_len]
      operation: add
    - what: outline
      name: led_hole
      extrude: led_tube_len + frame_t + plate_t + 1
      shift: [0, 0, -led_tube_len]
      operation: subtract
    - what: outline
      name: btn_holes
      extrude: btn_tube_len + frame_t + plate_t + 1
      shift: [0, 0, -btn_tube_len]
      operation: subtract
    - what: outline
      name: reset_ring
      extrude: ring_depth + 1
      shift: [0, 0, frame_t + plate_t - ring_depth]
      operation: subtract
  # Keyboard case (z = 0 is the case bottom): floor with the two module seats, walls with
  # openings for both USB-C plugs, and standoffs with M2 heat-set insert holes under all
  # mounting holes. The switch plate sits on the standoffs inside the walls. This is the
  # left half; wiring/build.js also writes the right half's cases (with _right) from a
  # mirrored run.
  keyboard_case:
    - what: outline
      name: case_outer
      extrude: case_floor
    - what: outline
      name: case_walls
      extrude: case_h
      operation: add
    - what: outline
      name: module_seats
      extrude: case_floor + seat_h
      operation: add
    # the standoffs (flared) and their insert holes (tapered) are added in wiring/build.js;
    # the holes are blind: they start on top of the floor, so the underside stays whole
    - what: outline
      name: usb_notch_mcu
      extrude: case_h
      shift: [0, 0, usb_z_mcu - usb_notch_down]
      operation: subtract
    - what: outline
      name: usb_notch_link
      extrude: case_h
      shift: [0, 0, usb_z_link - usb_notch_down]
      operation: subtract

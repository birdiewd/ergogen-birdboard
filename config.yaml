meta:
  engine: 4.1.0
units:
  # Proxy Spacing Variables
  kx: cx
  ky: cy
  # Padding Variables
  px: kx + 4
  py: ky + 4
  # Extra board on the left and bottom edges for M2 mounting holes. With it the edge is
  # 5 mm past the keycaps, so a hole centred 2.5 mm out clears an M2 head (3.8 mm)
  # on the keycap side and keeps 2.5 mm to the board edge.
  mount_pad: 3
  hole_d: 2.2         # M2 clearance hole (plate and cover)
  hole_off: 2.5       # hole centre distance outside the keycap edge
  # v4.5: handwired, as in the Scotto44. There is no PCB or wiring board: the switches clip
  # into a printed plate that covers just the keys, and the diodes and 18 AWG solid copper
  # wire are soldered straight onto the switch pins underneath (wiring/build.js draws the
  # guide). The RP2040-Zero and the USB-C breakout sit in seats on the case floor, under a
  # flat cover over the electronics strip beside the inner column.
  # Case (z = 0 is the bottom of the case). Stack:
  #   floor 1.5 | wiring space 5.5 (switch pins, diodes, wires; the modules on the floor)
  #   | switch plate 2.5 and strip cover 2.5 side by side (top at 9.5) | wall to 11.
  case_floor: 1.5     # floor thickness
  wire_gap: 5.5       # floor to the plate's underside (standoff height above the floor)
  frame_t: 1.3        # plate's lower (frame) layer: room for the switch housing below the clips
  plate_t: 1.2        # plate thickness the switch clips are made for: 1.20 +/- 0.05
  plate_z: case_floor + wire_gap                   # underside of the plate and the cover
  case_h: plate_z + frame_t + plate_t + 1.5        # wall height: 1.5 mm above the plate
  case_wall: 2        # wall thickness
  case_clear: 0.5     # gap between the plate edge and the wall
  case_off: case_clear + case_wall
  standoff_r: 2.5     # standoff radius (5 mm)
  insert_r: 1.6       # hole for an M2 heat-set insert (3.2 mm)
  # Flat cover over the electronics strip, as thick as the plate and beside it; screwed on
  # through the strip's two mounting holes.
  cover_boss: 3       # radius of the cover's tab round the hole it shares with the plate
  cover_gap: 0.3      # gap between the cover and the switch plate
  # Switch plate (Gateron LP 2.0 / KS-33 dimensional drawing)
  switch_cut: 14      # switch body at plate level: 14.00 +/- 0.03
  print_tol: 0.1      # extra clearance added to each cutout for 3D printing
  # Electronics strip beside the inner column (MCU at the top, USB-C link below it).
  # Its right edge lines up with the thumb cluster's right-most corner, and it runs down
  # to meet the thumb cluster. x positions below are measured from that edge (negative
  # = inwards), y positions from the inner column's top key (matrix_inner_top).
  mcu_w: 18.3         # Waveshare RP2040-Zero board
  mcu_h: 23.9
  mcu_t: 1.0          # its board thickness (component side up, USB-C on top at its top edge)
  usb_w: 13.8         # 4-pin USB-C breakout: length along the cable direction
  usb_h: 12           #   and width
  link_pcb_t: 1.6     #   and board thickness (receptacle on top, opening towards the other half)
  usb_gap: 10         # space between the MCU and the breakout
  mcu_x: -11.5        # RP2040-Zero centre
  mcu_y: 0.5py - mcu_h / 2                         # top edge on the strip's top edge
  link_y: 0.5py - mcu_h - usb_gap - usb_h / 2
  # Seats on the case floor: a low rim round three sides of each module (open where its
  # USB-C port faces the wall), with a little clearance. Stick the modules down with
  # double-sided tape.
  seat_tol: 0.3       # clearance round each module
  seat_rim: 1.2       # rim width
  seat_h: 2           # rim height above the floor
  # USB-C port centre heights: each receptacle (~3.2 tall) sits on its board on the floor.
  usb_z_mcu: case_floor + mcu_t + 1.6
  usb_z_link: case_floor + link_pcb_t + 1.6
  usb_notch_w: 13     # wall opening for a USB-C plug's overmould
  usb_notch_down: 3.3 # opening reaches this far below the port centre (open to the top)
  # Cover screw hole between the MCU and the breakout, near the strip's right edge.
  strip_hole_x: -2.25
points:
  zones:
    matrix:
      # Fix placement on KiCAD sheet.
      anchor:
        shift: [100, -100]
      # Column nets C0-C5 run outer to inner.
      # Row nets: R0 top, R1 home, R2 bottom, R3 thumb (mod + thumbfan).
      columns:
        outer:
          key.column_net: C0
        pinky:
          key.column_net: C1
        ring:
          key:
            stagger: 0.5ky
            column_net: C2
        middle:
          key.stagger: .25ky
          key.column_net: C3
        index:
          key.stagger: -.33ky
          key.column_net: C4
        inner:
          key.stagger: -.15ky
          key.column_net: C5
      # col_up: distance up to the next key in the same column, for the column trace
      # (0 = top of the column, its route to the MCU is a separate trace below).
      rows:
        bottom:
          row_net: R2
          col_up: 19
        home:
          row_net: R1
          col_up: 19
        top:
          row_net: R0
          col_up: 0
    mod:
      anchor:
        ref: matrix_outer_bottom
        shift: [0, -1.1ky]
      # Thumb row, first half: wired to the outer, pinky and ring columns.
      # col_up reaches the column's bottom key: 1.1ky, plus the ring column's 0.5ky stagger.
      columns:
        outer:
          key.column_net: C0
          key.col_up: 18.7
        pinky:
          key.column_net: C1
          key.col_up: 18.7
        ring:
          key.column_net: C2
          key.col_up: 27.2
      rows:
        thumb:
          row_net: R3
    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-1.4kx, -1.2ky]
      # Thumb row, second half: wired to the middle, index and inner columns.
      columns:
        outer:
          key.column_net: C3
        fn:
          key.shift: [.15kx, -.1ky]
          key.splay: -15
          key.column_net: C4
        home:
          key:
            width: 1.5kx
            shift: [.1kx, -.33ky]
            splay: 75
            column_net: C5
      # Not stacked on their columns: routed by the col_route_thumb_* traces instead.
      rows:
        thumb:
          row_net: R3
          col_up: 0
  # Mirror keyboard halves
  # mirror: &mirror
  #   ref: matrix_inner_top
  #   distance: 4kx
outlines:
  raw:
  - what: rectangle
    where: true
    size: [px, py]
  keys:
  - what: rectangle
    where: true
    bound: false
    size: [kx-0.5,ky-0.5]
  # The key area: the switch plate's outline.
  board:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        # top-left corner (mount_pad: room for mounting holes on the left edge)
        - ref: matrix_outer_top
          shift: [-0.5px - mount_pad, 0.5py]
        # top-left corner, raised by mount_pad for the hole above the ring key
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py + mount_pad]
        # top-left corner
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        # top-right corner (added so the top edge stays flat across the middle key)
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        # top-right corner
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # bottom-right corner
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.2py]
        # key is 1.5px wide and rotated 60 degrees, so its corners are at +/-0.75px
        # right-most corner
        - ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
        # bottom-most corner (added); pushed out along the key's length by mount_pad
        # (down and slightly left) so the bottom edge gets the same extra room
        - ref: thumbfan_home_thumb
          shift: [-0.75px - mount_pad, -0.5py]
        # bottom-right corner
        - ref: mod_ring_thumb
          shift: [0.5px, -0.5py - mount_pad]
        # bottom-left corner
        - ref: mod_outer_thumb
          shift: [-0.5px - mount_pad, -0.5py - mount_pad]
  combo:
    - name: board
    - operation: subtract
      name: keys
  # 14 x 14 mm switch cutouts (Gateron LP KS-33), plus a little print tolerance.
  switch_cutouts:
  - what: rectangle
    where: true
    bound: false
    size: [switch_cut + print_tol, switch_cut + print_tol]
  # Strip beside the inner column for the MCU and the USB-C link breakout. Its right
  # edge is vertical through the thumb cluster's right-most corner and runs down to
  # meet it; the other corners sit inside the key area so it merges with the board.
  # `thumb_edge` is an anchor step that keeps y but takes x from that corner.
  mcu_area:
  - what: polygon
    fillet: 2
    points:
      # top-left, on the board's top edge above the inner key
      - ref: matrix_inner_top
        shift: [0, 0.5py]
      # top-right: same height, x of the thumb corner
      - - ref: matrix_inner_top
          shift: [0, 0.5py]
        - &thumb_edge
          ref: thumbfan_home_thumb
          shift: [0.75px, -0.5py]
          affect: x
      # the thumb cluster's right-most corner
      - ref: thumbfan_home_thumb
        shift: [0.75px, -0.5py]
      # along the board edge from that corner, then back through the keys
      - ref: thumbfan_home_thumb
        shift: [0, -0.5py]
      - ref: thumbfan_home_thumb
      - ref: matrix_inner_bottom
  # Reference only (not cut): where the modules sit, to check fit in the viewer.
  modules:
  # RP2040-Zero, top edge on the strip's top edge, USB-C facing up
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w, mcu_h]
  # its USB-C receptacle, sticking out about 1.8 mm past the board edge
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + 11.05]
    size: [9, 5.3]
  # USB-C breakout below the MCU, opening facing +x (towards the other half)
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [-usb_w / 2, link_y]
    size: [usb_w, usb_h]
  # Floor seats for the two modules: a rim round each, open on the side its port faces.
  module_seats:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w + 2 seat_tol + 2 seat_rim, mcu_h + 2 seat_tol + 2 seat_rim]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y]
    size: [mcu_w + 2 seat_tol, mcu_h + 2 seat_tol]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, mcu_y + mcu_h / 2 + 5]
    size: [mcu_w + 10, 10]
  - what: rectangle
    operation: add
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [-usb_w / 2, link_y]
    size: [usb_w + 2 seat_tol + 2 seat_rim, usb_h + 2 seat_tol + 2 seat_rim]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [-usb_w / 2, link_y]
    size: [usb_w + 2 seat_tol, usb_h + 2 seat_tol]
  - what: rectangle
    operation: subtract
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [5, link_y]
    size: [10, usb_h + 10]
  # M2 mounting holes, 2.5 mm outside the keycaps: two on the left edge, two along the
  # bottom, one in the electronics strip between the MCU and the USB-C breakout and one
  # beyond the thumb key's outer end.
  mount_holes:
  - what: circle
    where: matrix_outer_top
    radius: hole_d / 2
    adjust: &h_left_top
      shift: [-0.5kx - hole_off, 0]
  - what: circle
    where: mod_outer_thumb
    radius: hole_d / 2
    adjust: &h_left_bottom
      shift: [-0.5kx - hole_off, -0.5ky - hole_off]
  - what: circle
    where: mod_ring_thumb
    radius: hole_d / 2
    adjust: &h_bottom
      shift: [0.5kx, -0.5ky - hole_off]
  - what: circle
    where: matrix_inner_top
    radius: hole_d / 2
    adjust: &h_strip
      - *thumb_edge
      - shift: [strip_hole_x, 0.5py - mcu_h - usb_gap / 2]
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb
      - shift: [0.75kx + hole_off, 0]
      # then 3 mm to the right on the board (drop the key's rotation first)
      - ref: matrix_inner_top
        affect: r
      - shift: [3, 0]
  # above the ring column's top key (the top edge is raised there by mount_pad)
  - what: circle
    where: matrix_ring_top
    radius: hole_d / 2
    adjust: &h_ring
      shift: [0, 0.5ky + hole_off]
  # below the middle column's bottom key
  - what: circle
    where: matrix_middle_bottom
    radius: hole_d / 2
    adjust: &h_middle
      shift: [0, -0.5ky - hole_off]
  # below the right-most thumb key: past its lower (down-left facing) end
  - what: circle
    where: thumbfan_home_thumb
    radius: hole_d / 2
    adjust: &h_thumb_low
      shift: [-0.75kx - hole_off, 0]
  # The key area grown by cover_gap: the cover stays out of it.
  # (`expand` applies to everything built so far, so it gets its own outline.)
  cover_keepout:
    - name: board
      expand: cover_gap
  # The hole beyond the thumb key sits on the line between the cover and the switch plate,
  # so the cover gets a round tab around it and the plate a matching notch (cover_gap wider).
  cover_tab:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss
    adjust: *h_thumb
  cover_tab_clear:
  - what: circle
    where: thumbfan_home_thumb
    radius: cover_boss + cover_gap
    adjust: *h_thumb
  # Electronics cover. Footprint: the strip right of the inner column, minus the keys'
  # padded areas (so it stays 2 mm clear of the keycaps) and minus the key area plus
  # cover_gap, so it never overlaps the switch plate.
  cover_area:
    - name: mcu_area
    - operation: intersect
      what: rectangle
      where: matrix_inner_top
      bound: false
      adjust:
        shift: [0.5px + 50, -50]
      size: [100, 200]
    - operation: subtract
      name: raw
    - operation: subtract
      name: cover_keepout
    - operation: add
      name: cover_tab
  cover:
    - name: cover_area
    - operation: subtract
      name: mount_holes
  # Top layer of the switch plate: the key area with a switch cutout per key, and the
  # mounting holes.
  plate:
    - name: board
    - operation: subtract
      name: switch_cutouts
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Bottom (frame) layer of the switch plate: ribs between the keys (combo) with the
  # mounting holes (and the notch for the cover's tab).
  frame:
    - name: combo
    - operation: subtract
      name: mount_holes
    - operation: subtract
      name: cover_tab_clear
  # Case outlines: the key area plus the electronics strip, grown outwards.
  _inside:
    - name: board
    - operation: add
      name: mcu_area
  case_outer:
    - name: _inside
      expand: case_off
  _case_inner:
    - name: _inside
      expand: case_clear
  case_walls:
    - name: case_outer
    - operation: subtract
      name: _case_inner
  # Standoffs under every mounting hole, with a hole for an M2 heat-set insert.
  case_standoffs:
    - name: mount_holes
      expand: standoff_r - hole_d / 2
  case_inserts:
    - name: mount_holes
      expand: insert_r - hole_d / 2
  # Wall openings for the two USB-C plugs: the MCU's port on the top edge, the link
  # breakout's port on the right edge (towards the other half). Each starts at the inside
  # of the wall, so the floor inside the case stays whole.
  usb_notch_mcu:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [mcu_x, 0.5py + case_clear + 7]
    size: [usb_notch_w, 14]
  usb_notch_link:
  - what: rectangle
    where: matrix_inner_top
    bound: false
    adjust:
      - *thumb_edge
      - shift: [case_clear + 7, link_y]
    size: [14, usb_notch_w]
cases:
  # 3D-printable switch plate (z = 0 is its underside), screwed onto the case standoffs.
  #   - frame: ribs between the keycap-sized openings, frame_t thick; stiffens the plate
  #     and clears the switch's lower housing
  #   - plate: plate_t thick on top, with 14 mm switch cutouts for the clips
  # Print it upside down (plate layer on the bed) for a flat top surface.
  switchplate:
    - what: outline
      name: frame
      extrude: frame_t
    - what: outline
      name: plate
      extrude: plate_t
      shift: [0, 0, frame_t]
      operation: add
  # Keyboard case (z = 0 is the case bottom): floor with the two module seats, walls with
  # openings for both USB-C plugs, and standoffs with M2 heat-set insert holes under all
  # mounting holes. The switch plate and the strip cover sit on the standoffs, side by
  # side, inside the walls. This is the left half; wiring/build.js also writes the right
  # half's cases (with _right) from a mirrored run.
  keyboard_case:
    - what: outline
      name: case_outer
      extrude: case_floor
    - what: outline
      name: case_walls
      extrude: case_h
      operation: add
    - what: outline
      name: case_standoffs
      extrude: plate_z
      operation: add
    - what: outline
      name: module_seats
      extrude: case_floor + seat_h
      operation: add
    - what: outline
      name: case_inserts
      extrude: case_h
      operation: subtract
    - what: outline
      name: usb_notch_mcu
      extrude: case_h
      shift: [0, 0, usb_z_mcu - usb_notch_down]
      operation: subtract
    - what: outline
      name: usb_notch_link
      extrude: case_h
      shift: [0, 0, usb_z_link - usb_notch_down]
      operation: subtract
  # Flat cover over the electronics strip (z = 0 is its underside), as thick as the
  # switch plate and level with it. Screws through the two strip holes (between the MCU
  # and the breakout, and beyond the thumb key).
  mcu_cover:
    - what: outline
      name: cover
      extrude: frame_t + plate_t
